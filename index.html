<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // Safe Storage Adapter (localStorage)
    const storageAdapter = {
      async get(key) {
        try { const val = localStorage.getItem(key); return val ? { value: val } : null; } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      },
    };

    const COURSES = [
      "Vergi Hukuku", "Ceza Hukuku (Özel Hükümler)", "Borçlar Hukuku (Özel Hükümler)",
      "Medeni Usul Hukuku", "Ticaret Hukuku", "İdari Yargılama Hukuku", "Eşya Hukuku",
    ];

    const WEEKDAY_ORDER = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const WEEKDAY_BY_INDEX = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    const LAWS = [
      { code: "TMK", title: "Türk Medeni Kanunu", note: "4721 sayılı — kişiler, aile, miras ve eşya hukuku (1030 madde)", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=4721&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TBK", title: "Türk Borçlar Kanunu", note: "6098 sayılı — borç ilişkileri, sözleşmeler, haksız fiil", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6098&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TCK", title: "Türk Ceza Kanunu", note: "5237 sayılı — suçlar, cezalar ve güvenlik tedbirleri", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=5237&MevzuatTur=1&MevzuatTertip=5" },
    ];

    const SEED_CARDS = [
      { id: uid(), topic: "Eşya Hukuku", front: "Zilyetlik türleri nelerdir ve dolaysız zilyetlik ne anlama gelir?", back: "Zilyetlik; asli-fer'i, dolaylı-dolaysız ve tek başına-birlikte zilyetlik olarak ayrılır. Fiili hakimiyeti doğrudan doğruya kullanan kişi dolaysız zilyettir (örneğin kiracı).", level: 0, lastReviewed: null },
      { id: uid(), topic: "Borçlar Hukuku (Özel)", front: "Satış sözleşmesinde satıcının ayıptan sorumluluğunun şartları nelerdir?", back: "1. Malın ayıplı olması, 2. Ayıbın hasarın geçtiği anda var olması, 3. Alıcının ayıbı bilmemesi, 4. Alıcının muayene ve ihbar külfetini yerine getirmiş olması.", level: 0, lastReviewed: null },
    ];

    const SEED_CASES = [
      { id: uid(), course: "Eşya Hukuku", title: "Tapuda Çift Kayıt ve İyiniyetli Üçüncü Kişi", factPattern: "(A), adına tapuda kayıtlı taşınmazı (B)'ye satmış fakat tescil yapılmamıştır. Yolsuz tescilden yararlanan (C) ise taşınmazı iyi niyetle (D)'ye devretmiştir.", legalIssue: "(D)'nin iktisabı TMK m. 1023 kapsamında korunur mu?", statute: "TMK m. 1023, TMK m. 1024", solution: "TMK m. 1023 uyarınca tapu kütüğündeki tescile iyiniyetle dayanarak ayni hak kazanan üçüncü kişinin bu kazanımı korunur. (D) iyiniyetli olduğu için mülkiyeti kazanır." },
    ];

    const SEED_DICTIONARY = [
      { id: uid(), term: "Müteselsil Sorumluluk", definition: "Birden fazla borçlunun, borcun tamamından zincirleme olarak sorumlu olması durumu." },
      { id: uid(), term: "Zilyetlik", definition: "Bir eşya üzerinde fiili hakimiyet kurma durumu." },
      { id: uid(), term: "İlliyet Bağı", definition: "Neden-sonuç ilişkisi. Haksız fiillerde zarar ile fiil arasındaki bağ." },
    ];

    const getDaysLeft = (targetDateStr) => {
      const now = new Date(); const target = new Date(targetDateStr);
      now.setHours(0, 0, 0, 0); target.setHours(0, 0, 0, 0);
      const diffTime = target - now; const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    };

    const getDriveEmbedUrl = (url) => {
      if (!url || !url.includes("drive.google.com")) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) return null; return `https://drive.google.com/file/d/${match[1]}/preview`;
    };

    const NOTE_COLORS = [
      { key: "none", label: "Etiketsiz", color: "#D9CFB8" }, { key: "onemli", label: "Önemli", color: "#B8923F" },
      { key: "sinav", label: "Sınavda çıkar", color: "#7C2D3B" }, { key: "karistiriyorum", label: "Karıştırıyorum", color: "#A6432F" },
      { key: "ogrendim", label: "Öğrendim", color: "#4C6B4F" },
    ];
    const getNoteColor = (key) => (NOTE_COLORS.find((c) => c.key === key) || NOTE_COLORS[0]).color;
    const COURTS = ["Yargıtay", "Danıştay", "Anayasa Mahkemesi", "BAM", "Diğer"];

    const CODE_ALIASES = { TMK: "TMK", MK: "TMK", TBK: "TBK", BK: "TBK", TCK: "TCK", CK: "TCK", HMK: "HMK", IYUK: "İYUK", KMK: "KMK", TTK: "TTK", VUK: "VUK", IIK: "İİK" };

    const parseArticleRefs = (text, defaultCode) => {
      if (!text) return []; const found = new Set();
      const up = String(text).toUpperCase().replace(/İ/g, "I").replace(/Ş/g, "S").replace(/Ğ/g, "G").replace(/Ü/g, "U").replace(/Ö/g, "O").replace(/Ç/g, "C");
      const withCode = /\b(TMK|TBK|TCK|HMK|IYUK|KMK|TTK|VUK|IIK|MK|BK|CK)\b[\s.]*(?:MADDE|M)?[\s.]*(\d{1,4})/g; let m;
      while ((m = withCode.exec(up)) !== null) { const code = CODE_ALIASES[m[1]] || m[1]; found.add(code + " " + m[2]); }
      if (defaultCode) {
        const noCode = /(?:^|[^A-Z0-9])(?:MADDE|M)[\s.]+(\d{1,4})/g;
        while ((m = noCode.exec(up)) !== null) { found.add(defaultCode + " " + m[1]); }
      }
      return Array.from(found);
    };

    const sortArticleRefs = (a, b) => {
      const [ca, na] = a.split(" "); const [cb, nb] = b.split(" ");
      if (ca !== cb) return ca.localeCompare(cb, "tr"); return parseInt(na, 10) - parseInt(nb, 10);
    };

    // Push Notifications Logic
    const WORK_MSGS = [
      "Süre doldu! Harika bir odaklanmaydı, şimdi kısa bir dinlenme vakti.",
      "Zaman bitti! Bir bardak su iç ve gözlerini ekrandan/kitaptan ayır.",
      "Hedefine bir adım daha yaklaştın. Şimdi derin bir nefes al ve mola ver!"
    ];
    const BREAK_MSGS = [
      "Mola bitti! Hayallerin ve hedeflerin için tekrar masaya dönme vakti.",
      "Dinlenme süren doldu. Hadi o konuyu bitirelim, odaklan!",
      "Kitaplar seni bekliyor, geleceğin için çalışmaya devam!"
    ];

    function HukukFisleri() {
      const [loading, setLoading] = useState(true);
      const [cards, setCards] = useState([]);
      const [resources, setResources] = useState({});
      const [cases, setCases] = useState([]);
      const [lawNotes, setLawNotes] = useState({});
      const [precedents, setPrecedents] = useState([]);
      const [dictionary, setDictionary] = useState([]); 

      const [tab, setTab] = useState("dersler");
      const [lawSubTab, setLawSubTab] = useState("kanunlar");
      const [pratikSubTab, setPratikSubTab] = useState("olaylar");
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [showResourceForm, setShowResourceForm] = useState(false);
      const [resourceForm, setResourceForm] = useState({ title: "", url: "", note: "", category: "Genel" });
      const [editingResourceId, setEditingResourceId] = useState(null);
      const [expandedResourceId, setExpandedResourceId] = useState(null);

      const [showSettings, setShowSettings] = useState(false);
      const [showGlobalSearch, setShowGlobalSearch] = useState(false);
      const [globalQuery, setGlobalQuery] = useState("");
      const [showFocusMode, setShowFocusMode] = useState(false);
      const [audioMode, setAudioMode] = useState(false);
      const [darkMode, setDarkModeState] = useState(false);
      const [grades, setGrades] = useState({});
      const [examDates, setExamDates] = useState({ vize: "", final: "" });

      const [selectedTopic, setSelectedTopic] = useState("Tümü");
      const [queueIds, setQueueIds] = useState([]);
      const [cursor, setCursor] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [quizMode, setQuizMode] = useState(false);
      const [quiz, setQuiz] = useState(null);

      const [weeklyPlan, setWeeklyPlan] = useState({});
      const [expandedDay, setExpandedDay] = useState(null);

      const [lawSearch, setLawSearch] = useState("");
      const [expandedLaw, setExpandedLaw] = useState(null);
      const [noteDraft, setNoteDraft] = useState({ madde: "", text: "", color: "none", review: false });
      const [editingNoteId, setEditingNoteId] = useState(null);
      const [onlyFlaggedNotes, setOnlyFlaggedNotes] = useState(false);

      const [articleSearch, setArticleSearch] = useState("");
      const [selectedArticle, setSelectedArticle] = useState(null);

      const [showAddForm, setShowAddForm] = useState(false);
      const [showBulkForm, setShowBulkForm] = useState(false);
      const [printCourse, setPrintCourse] = useState(null);
      const [shareIntake, setShareIntake] = useState(null);
      const [bulkForm, setBulkForm] = useState({ topic: "", text: "" });
      const [form, setForm] = useState({ topic: "", front: "", back: "", statute: "" });
      const [editingCardId, setEditingCardId] = useState(null);

      const [openCaseId, setOpenCaseId] = useState(null);
      const [showCaseForm, setShowCaseForm] = useState(false);
      const [caseForm, setCaseForm] = useState({ course: COURSES[0], title: "", factPattern: "", legalIssue: "", statute: "", solution: "" });
      const [editingCaseId, setEditingCaseId] = useState(null);

      const [openPrecedentId, setOpenPrecedentId] = useState(null);
      const [showPrecedentForm, setShowPrecedentForm] = useState(false);
      const [precedentForm, setPrecedentForm] = useState({ court: COURTS[0], caseNo: "", date: "", topic: "", statute: "", summary: "" });
      const [editingPrecedentId, setEditingPrecedentId] = useState(null);
      const [precedentSearch, setPrecedentSearch] = useState("");
      const [toast, setToast] = useState(null);

      const [showDictForm, setShowDictForm] = useState(false);
      const [dictForm, setDictForm] = useState({ term: "", definition: "" });
      const [editingDictId, setEditingDictId] = useState(null);
      const [dictSearch, setDictSearch] = useState("");

      // Pomodoro States
      const [pomoSettings, setPomoSettings] = useState({ work: 25, break: 5 });
      const [pomoSettingsDraft, setPomoSettingsDraft] = useState({ work: 25, break: 5 });
      const [pomoMinutes, setPomoMinutes] = useState(25);
      const [pomoSeconds, setPomoSeconds] = useState(0);
      const [pomoIsRunning, setPomoIsRunning] = useState(false);
      const [pomoMode, setPomoMode] = useState("work"); 
      const [notificationGranted, setNotificationGranted] = useState(false);

      const currentYear = new Date().getFullYear();
      const defaultVizeDateStr = `${currentYear}-12-28`;
      const defaultFinalDateStr = `${new Date().getMonth() >= 6 ? currentYear + 1 : currentYear}-06-01`;

      const vizeDateStr = examDates.vize || defaultVizeDateStr;
      const finalDateStr = examDates.final || defaultFinalDateStr;
      const vizeDays = useMemo(() => getDaysLeft(vizeDateStr), [vizeDateStr]);
      const finalDays = useMemo(() => getDaysLeft(finalDateStr), [finalDateStr]);

      const formatDateLabel = (dateStr) => {
        try { const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" }); } catch (e) { return dateStr; }
      };

      const dailyTarget = 10;
      const todayReviewedCount = useMemo(() => {
        const todayStr = new Date().toISOString().split("T")[0];
        return cards.filter(c => c.lastReviewed && c.lastReviewed.startsWith(todayStr)).length;
      }, [cards]);

      const studyDaysSet = useMemo(() => {
        const set = new Set(); cards.forEach((c) => { if (c.lastReviewed) set.add(c.lastReviewed.split("T")[0]); }); return set;
      }, [cards]);

      const currentStreak = useMemo(() => {
        let streak = 0; let d = new Date(); const todayStr = d.toISOString().split("T")[0];
        if (!studyDaysSet.has(todayStr)) d.setDate(d.getDate() - 1);
        while (studyDaysSet.has(d.toISOString().split("T")[0])) { streak++; d.setDate(d.getDate() - 1); }
        return streak;
      }, [studyDaysSet]);

      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i); const dStr = d.toISOString().split("T")[0];
          const count = cards.filter((c) => c.lastReviewed && c.lastReviewed.startsWith(dStr)).length;
          days.push({ label: d.toLocaleDateString("tr-TR", { weekday: "short" }), count, isToday: i === 0 });
        }
        return days;
      }, [cards]);

      const todayWeekdayName = WEEKDAY_BY_INDEX[new Date().getDay()];
      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

      useEffect(() => {
        if ("Notification" in window) {
          setNotificationGranted(Notification.permission === "granted");
        }
      }, []);

      const requestNotificationPermission = () => {
        if (!("Notification" in window)) {
          showToast("Tarayıcınız bildirimleri desteklemiyor.");
          return;
        }
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            setNotificationGranted(true);
            showToast("Harika! Artık süre bitiminde bildirim alacaksın.");
          } else {
            showToast("Bildirimlere izin verilmedi.");
          }
        });
      };

      const sendPomoNotification = (title, body) => {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(title, { body, icon: "icon-192.png" });
        }
      };

      useEffect(() => {
        (async () => {
          let loadedCards = SEED_CARDS; let loadedResources = {}; let loadedCases = SEED_CASES; let loadedLawNotes = {};
          let loadedExamDates = { vize: "", final: "" }; let loadedWeeklyPlan = {}; let loadedPrecedents = []; let loadedDictionary = SEED_DICTIONARY;
          let loadedPomo = { work: 25, break: 5 };

          try { const c = await storageAdapter.get("cards"); if (c && c.value) loadedCards = JSON.parse(c.value); } catch (e) {}
          try { const r = await storageAdapter.get("resources"); if (r && r.value) loadedResources = JSON.parse(r.value); } catch (e) {}
          try { const cs = await storageAdapter.get("cases"); if (cs && cs.value) loadedCases = JSON.parse(cs.value); } catch (e) {}
          try { const ln = await storageAdapter.get("law-notes"); if (ln && ln.value) loadedLawNotes = JSON.parse(ln.value); } catch (e) {}
          try { const ed = await storageAdapter.get("exam-dates"); if (ed && ed.value) loadedExamDates = JSON.parse(ed.value); } catch (e) {}
          try {
            const wp = await storageAdapter.get("weekly-plan");
            if (wp && wp.value) {
              const parsed = JSON.parse(wp.value); const migrated = {};
              for (let day of Object.keys(parsed)) {
                migrated[day] = parsed[day].map(c => typeof c === 'string' ? { id: uid(), course: c, time: "09:00", location: "Amfi 1" } : c);
              }
              loadedWeeklyPlan = migrated;
            }
          } catch (e) {}
          try { const pr = await storageAdapter.get("precedents"); if (pr && pr.value) loadedPrecedents = JSON.parse(pr.value); } catch (e) {}
          try { const dict = await storageAdapter.get("dictionary"); if (dict && dict.value) loadedDictionary = JSON.parse(dict.value); } catch (e) {}
          try { const ps = await storageAdapter.get("pomo-settings"); if (ps && ps.value) loadedPomo = JSON.parse(ps.value); } catch (e) {}

          let loadedAudioMode = false; try { const am = await storageAdapter.get("audio-mode"); if (am && am.value) loadedAudioMode = JSON.parse(am.value); } catch (e) {}
          let loadedDarkMode = false; try { const dm = await storageAdapter.get("dark-mode"); if (dm && dm.value) loadedDarkMode = JSON.parse(dm.value); } catch (e) {}
          let loadedGrades = {}; try { const gr = await storageAdapter.get("grades"); if (gr && gr.value) loadedGrades = JSON.parse(gr.value); } catch (e) {}

          setCards(loadedCards); setResources(loadedResources); setCases(loadedCases); setLawNotes(loadedLawNotes);
          setExamDates(loadedExamDates); setWeeklyPlan(loadedWeeklyPlan); setPrecedents(loadedPrecedents); setDictionary(loadedDictionary);
          setAudioMode(loadedAudioMode); setDarkModeState(loadedDarkMode); setGrades(loadedGrades);
          
          setPomoSettings(loadedPomo); setPomoSettingsDraft(loadedPomo); setPomoMinutes(loadedPomo.work);
          setLoading(false);
        })();
      }, []);

      // Pomodoro Effect
      useEffect(() => {
        let interval = null;
        if (pomoIsRunning) {
          interval = setInterval(() => {
            if (pomoSeconds > 0) {
              setPomoSeconds(s => s - 1);
            } else {
              if (pomoMinutes > 0) {
                setPomoMinutes(m => m - 1);
                setPomoSeconds(59);
              } else {
                setPomoIsRunning(false);
                const nextMode = pomoMode === "work" ? "break" : "work";
                setPomoMode(nextMode);
                setPomoMinutes(nextMode === "work" ? pomoSettings.work : pomoSettings.break);
                
                const randomMsg = nextMode === "break" 
                  ? WORK_MSGS[Math.floor(Math.random() * WORK_MSGS.length)]
                  : BREAK_MSGS[Math.floor(Math.random() * BREAK_MSGS.length)];

                showToast(randomMsg);
                sendPomoNotification(nextMode === "break" ? "Mola Vakti ☕" : "Çalışma Vakti 📚", randomMsg);

                if (audioMode || "speechSynthesis" in window) {
                   const utter = new SpeechSynthesisUtterance(randomMsg);
                   utter.lang = "tr-TR";
                   window.speechSynthesis.speak(utter);
                }
              }
            }
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [pomoIsRunning, pomoMinutes, pomoSeconds, pomoMode, pomoSettings]);

      const formatPomoTime = () => `${String(pomoMinutes).padStart(2, '0')}:${String(pomoSeconds).padStart(2, '0')}`;

      const resetPomodoro = (mode) => {
        setPomoIsRunning(false);
        setPomoMode(mode);
        setPomoMinutes(mode === "work" ? pomoSettings.work : pomoSettings.break);
        setPomoSeconds(0);
      };

      const savePomoSettings = () => {
        let w = parseInt(pomoSettingsDraft.work); let b = parseInt(pomoSettingsDraft.break);
        if (isNaN(w) || w <= 0) w = 25; if (isNaN(b) || b <= 0) b = 5;
        const next = { work: w, break: b };
        setPomoSettings(next);
        storageAdapter.set("pomo-settings", JSON.stringify(next));
        
        if (!pomoIsRunning) {
          setPomoMinutes(pomoMode === "work" ? w : b);
          setPomoSeconds(0);
        }
        showToast("Süreler başarıyla kaydedildi.");
      };

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const sharedUrl = params.get("url") || params.get("text") || "";
        const sharedTitle = params.get("title") || "";
        if (sharedUrl) { setShareIntake({ url: sharedUrl, title: sharedTitle }); window.history.replaceState({}, "", window.location.pathname); }
      }, []);

      useEffect(() => {
        if (!printCourse) return; const t = setTimeout(() => window.print(), 150); return () => clearTimeout(t);
      }, [printCourse]);
      useEffect(() => { const handleAfterPrint = () => setPrintCourse(null); window.addEventListener("afterprint", handleAfterPrint); return () => window.removeEventListener("afterprint", handleAfterPrint); }, []);

      const saveCards = useCallback(async (next) => { setCards(next); await storageAdapter.set("cards", JSON.stringify(next)); }, []);
      const saveResources = useCallback(async (next) => { setResources(next); await storageAdapter.set("resources", JSON.stringify(next)); }, []);
      const saveCases = useCallback(async (next) => { setCases(next); await storageAdapter.set("cases", JSON.stringify(next)); }, []);
      const savePrecedents = useCallback(async (next) => { setPrecedents(next); await storageAdapter.set("precedents", JSON.stringify(next)); }, []);
      const saveDictionary = useCallback(async (next) => { setDictionary(next); await storageAdapter.set("dictionary", JSON.stringify(next)); }, []);
      const saveWeeklyPlan = useCallback(async (next) => { setWeeklyPlan(next); await storageAdapter.set("weekly-plan", JSON.stringify(next)); }, []);

      const addScheduleItem = (day) => { const current = weeklyPlan[day] || []; saveWeeklyPlan({...weeklyPlan, [day]: [...current, { id: uid(), course: COURSES[0], time: "09:00", location: "" }]}); };
      const updateScheduleItem = (day, id, field, value) => { const current = weeklyPlan[day] || []; saveWeeklyPlan({...weeklyPlan, [day]: current.map(item => item.id === id ? {...item, [field]: value} : item)}); };
      const removeScheduleItem = (day, id) => { const current = weeklyPlan[day] || []; saveWeeklyPlan({...weeklyPlan, [day]: current.filter(item => item.id !== id)}); };

      const addDictTerm = () => {
        if (!dictForm.term.trim() || !dictForm.definition.trim()) { showToast("Terim ve açıklama gerekli."); return; }
        if (editingDictId) {
          saveDictionary(dictionary.map(d => d.id === editingDictId ? { ...d, term: dictForm.term.trim(), definition: dictForm.definition.trim() } : d));
          setEditingDictId(null); setDictForm({ term: "", definition: "" }); setShowDictForm(false); showToast("Terim güncellendi."); return;
        }
        const newTerm = { id: uid(), term: dictForm.term.trim(), definition: dictForm.definition.trim() };
        saveDictionary([...dictionary, newTerm].sort((a,b) => a.term.localeCompare(b.term, "tr")));
        setDictForm({ term: "", definition: "" }); setShowDictForm(false); showToast("Terim eklendi.");
      };

      const addPrecedent = () => {

        }

      };

      const startEditPrecedent = (p) => { setEditingPrecedentId(p.id); setPrecedentForm({ court: p.court, caseNo: p.caseNo || "", date: p.date || "", topic: p.topic || "", statute: p.statute || "", summary: p.summary || "" }); setShowPrecedentForm(true); };
      const cancelPrecedentEdit = () => { setEditingPrecedentId(null); setPrecedentForm({ court: COURTS[0], caseNo: "", date: "", topic: "", statute: "", summary: "" }); setShowPrecedentForm(false); };

      const updateGrade = (course, field, value) => { const current = grades[course] || {}; saveGrades({ ...grades, [course]: { ...current, [field]: value } }); };
      const getLetterGrade = (score) => { if (score >= 88) return "AA"; if (score >= 81) return "BA"; if (score >= 74) return "BB"; if (score >= 67) return "CB"; if (score >= 60) return "CC"; if (score >= 53) return "DC"; if (score >= 46) return "DD"; if (score >= 39) return "FD"; return "FF"; };

      };

      const saveLawNotes = useCallback(async (next) => { setLawNotes(next); await storageAdapter.set("law-notes", JSON.stringify(next)); }, []);
      const saveExamDates = useCallback(async (next) => { setExamDates(next); await storageAdapter.set("exam-dates", JSON.stringify(next)); }, []);

      const exportBackup = () => {
        const payload = { app: "muzo-hukuk", version: 1, exportedAt: new Date().toISOString(), cards, resources, cases, lawNotes, examDates, weeklyPlan, precedents, grades, dictionary, pomoSettings };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = `muzo-hukuk-yedek-${new Date().toISOString().split("T")[0]}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast("Yedek indirildi.");
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0]; if (!file) return; const reader = new FileReader();

          try {
            const data = JSON.parse(ev.target.result);
            if (!data || data.app !== "muzo-hukuk") { showToast("Bu bir Muzo Hukuk yedek dosyası değil."); return; }
            if (data.cards) await saveCards(data.cards); if (data.resources) await saveResources(data.resources); if (data.cases) await saveCases(data.cases);
            if (data.lawNotes) await saveLawNotes(data.lawNotes); if (data.examDates) await saveExamDates(data.examDates); if (data.weeklyPlan) await saveWeeklyPlan(data.weeklyPlan);
            if (data.precedents) await savePrecedents(data.precedents); if (data.grades) await saveGrades(data.grades); if (data.dictionary) await saveDictionary(data.dictionary);
            if (data.pomoSettings) { setPomoSettings(data.pomoSettings); setPomoSettingsDraft(data.pomoSettings); await storageAdapter.set("pomo-settings", JSON.stringify(data.pomoSettings)); }
            showToast("Yedek geri yüklendi!"); setShowSettings(false);
          } catch (err) { showToast("Dosya okunamadı, geçerli bir JSON yedeği olmalı."); }
        };
        reader.readAsText(file); e.target.value = "";

      const addResource = () => {

      const articleIndex = useMemo(() => {

        cards.forEach((c) => {
          const refs = new Set([...parseArticleRefs(c.statute, null), ...parseArticleRefs(c.front, null), ...parseArticleRefs(c.back, null)]);
          refs.forEach((r) => add(r, "cards", c));
        });
        cases.forEach((c) => {
          const refs = new Set([...parseArticleRefs(c.statute, null), ...parseArticleRefs(c.legalIssue, null), ...parseArticleRefs(c.solution, null)]);
          refs.forEach((r) => add(r, "cases", c));
        });
        Object.entries(lawNotes).forEach(([code, notes]) => {
          (notes || []).forEach((n) => {
            const refs = new Set([...parseArticleRefs(n.madde, code), ...parseArticleRefs(n.text, code)]);
            refs.forEach((r) => add(r, "notes", { ...n, code }));
          });
        });
        precedents.forEach((p) => {
          const refs = new Set([...parseArticleRefs(p.statute, null), ...parseArticleRefs(p.summary, null)]);
          refs.forEach((r) => add(r, "precedents", p));
        });
        return idx;
      }, [cards, cases, lawNotes, precedents]);

      const articleRefList = useMemo(() => {
        const q = articleSearch.trim().toUpperCase().replace(/\s+/g, " ");

      }, [articleIndex, articleSearch]);

      const topics = useMemo(() => { const set = new Set(cards.map((c) => c.topic)); return Array.from(set); }, [cards]);
      const topicStats = useMemo(() => {
        return topics.map((t) => {

          const avg = tc.length ? tc.reduce((s, c) => s + c.level, 0) / (tc.length * 4) : 0;
          return { topic: t, count: tc.length, mastery: Math.round(avg * 100) };
        });
      }, [cards, topics]);

      const weakestTopics = useMemo(() => { return [...topicStats].filter((t) => t.count > 0).sort((a, b) => a.mastery - b.mastery).slice(0, 3); }, [topicStats]);
      const flaggedNotesList = useMemo(() => {
        const list = []; Object.entries(lawNotes).forEach(([code, notes]) => { (notes || []).forEach((n) => { if (n.review) list.push({ ...n, code }); }); }); return list;
      }, [lawNotes]);

      const todaysPlanCourses = weeklyPlan[todayWeekdayName] || [];

      const globalSearchResults = useMemo(() => {
        const q = globalQuery.trim().toLowerCase();

        const res = { cards: [], resources: [], cases: [], precedents: [], notes: [], dictionary: [] };

        cards.forEach((c) => { if ([c.topic, c.front, c.back, c.statute].filter(Boolean).join(" ").toLowerCase().includes(q)) res.cards.push(c); });
        Object.entries(resources).forEach(([course, list]) => { (list || []).forEach((r) => { if ([r.title, r.note, course].filter(Boolean).join(" ").toLowerCase().includes(q)) res.resources.push({ ...r, course }); }); });
        cases.forEach((c) => { if ([c.title, c.factPattern, c.legalIssue, c.solution, c.statute, c.course].filter(Boolean).join(" ").toLowerCase().includes(q)) res.cases.push(c); });
        precedents.forEach((p) => { if ([p.court, p.caseNo, p.topic, p.statute, p.summary].filter(Boolean).join(" ").toLowerCase().includes(q)) res.precedents.push(p); });
        Object.entries(lawNotes).forEach(([code, list]) => { (list || []).forEach((n) => { if ([n.madde, n.text, code].filter(Boolean).join(" ").toLowerCase().includes(q)) res.notes.push({ ...n, code }); }); });
        dictionary.forEach((d) => { if ([d.term, d.definition].filter(Boolean).join(" ").toLowerCase().includes(q)) res.dictionary.push(d); });

        return res;
      }, [globalQuery, cards, resources, cases, precedents, lawNotes, dictionary]);

      const globalResultCount = globalSearchResults ? Object.values(globalSearchResults).reduce((s, arr) => s + arr.length, 0) : 0;

      const goToCard = (card) => { setTab("cards"); setQuizMode(false); setQuiz(null); setSelectedTopic(card.topic || "Tümü"); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToResource = (course) => { setTab("dersler"); setSelectedCourse(course); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToCase = (c) => { setTab("pratik"); setPratikSubTab("olaylar"); setOpenCaseId(c.id); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToPrecedent = (p) => { setTab("pratik"); setPratikSubTab("ictihat"); setOpenPrecedentId(p.id); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToLawNote = (code) => { setTab("kanunlar"); setLawSubTab("kanunlar"); setExpandedLaw(code); setOnlyFlaggedNotes(false); setShowGlobalSearch(false); setShowFocusMode(false); };

      useEffect(() => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        const sorted = [...pool].sort((a, b) => a.level - b.level || (a.lastReviewed || "").localeCompare(b.lastReviewed || ""));
        setQueueIds(sorted.map((c) => c.id)); setCursor(0); setFlipped(false);
      }, [selectedTopic, tab, cards]);

      const queue = queueIds.map((id) => cards.find((c) => c.id === id)).filter(Boolean);
      const current = queue[cursor % Math.max(queue.length, 1)];

      useEffect(() => { if (tab !== "cards" && "speechSynthesis" in window) window.speechSynthesis.cancel(); }, [tab]);
      useEffect(() => { if (!audioMode || quizMode || !current) return; speak(flipped ? current.back : current.front); }, [audioMode, flipped, current && current.id, quizMode]);

      const rate = (delta) => {
        if (!current) return;
        const next = cards.map((c) => c.id === current.id ? { ...c, level: Math.max(0, Math.min(4, c.level + delta)), lastReviewed: new Date().toISOString() } : c);
        saveCards(next); setFlipped(false); setCursor((c) => c + 1);
      };

      const deleteCard = (id) => { if (!confirm("Bu fişi silmek istediğine emin misin?")) return; saveCards(cards.filter((c) => c.id !== id)); showToast("Fiş silindi."); };

      const startQuiz = () => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        if (pool.length < 2) { showToast("Deneme başlatmak için en az 2 fiş gerekli."); return; }
        const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
        const questions = shuffled.map((c) => {
          const distractorPool = cards.filter((o) => o.id !== c.id && o.back !== c.back);
          const distractors = distractorPool.sort(() => Math.random() - 0.5).slice(0, 3).map((o) => o.back);
          const options = [...distractors, c.back].sort(() => Math.random() - 0.5);
          return { cardId: c.id, front: c.front, correct: c.back, options };
        });
        setQuiz({ questions, i: 0, score: 0, answered: false, picked: null, finished: false }); setQuizMode(true);
      };

      const answerQuiz = (opt) => {
        if (!quiz || quiz.answered) return;
        const isCorrect = opt === quiz.questions[quiz.i].correct;
        setQuiz({ ...quiz, answered: true, picked: opt, score: quiz.score + (isCorrect ? 1 : 0) });
      };

      const nextQuizQuestion = () => {
        if (!quiz) return;
        if (quiz.i + 1 >= quiz.questions.length) { setQuiz({ ...quiz, finished: true }); }
        else { setQuiz({ ...quiz, i: quiz.i + 1, answered: false, picked: null }); }

      const COLORS = darkMode ? {
        ink: "#1C2B4A", parchment: "#12161F", bordo: "#DD90A2", gold: "#D8B36C", charcoal: "#C7C0B0",
        green: "#84B48B", rust: "#DB8B67", line: "#2C3542", surface: "#1B212C", track: "#29323D", heading: "#EEE7D6",
      } : {
        ink: "#1C2B4A", parchment: "#F6F1E4", bordo: "#7C2D3B", gold: "#B8923F", charcoal: "#2A2622",

                </button>

            <button onClick={() => setShowFocusMode(true)} style={{
              width: "100%", marginTop: 12, padding: "11px 0", borderRadius: 8,

                                <button onClick={() => removeScheduleItem(day, item.id)} style={{ background: "none", border: "none", color: COLORS.rust, padding: "4px 8px", fontSize: 16, fontWeight: 700 }}>✕</button>
                              </div>
                              <input type="text" placeholder="Derslik (Örn: Hukuk Fakültesi Amfi 1)" value={item.location} onChange={(e) => updateScheduleItem(day, item.id, 'location', e.target.value)} style={{ width: "100%", padding: "6px 8px", borderRadius: 4, border: `1px solid ${COLORS.line}`, background: COLORS.surface, color: COLORS.heading, fontSize: 12 }} />
                            </div>
                          ))}
                          <button onClick={() => addScheduleItem(day)} style={{ width: "100%", padding: "8px 0", borderRadius: 6, border: `1px dashed ${COLORS.bordo}`, background: "transparent", color: COLORS.bordo, fontWeight: 600, fontSize: 12.5 }}>+ Derse Ekle</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: COLORS.bordo, marginBottom: 8 }}>📊 SINAV NOTLARIM</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
                {COURSES.map((course) => {
                  const g = grades[course] || {}; const vizeNum = parseFloat(g.vize); const finalNum = parseFloat(g.final);
                  const hasBoth = !isNaN(vizeNum) && !isNaN(finalNum); const weighted = hasBoth ? Math.round(vizeNum * 0.4 + finalNum * 0.6) : null;
                  const letter = weighted !== null ? getLetterGrade(weighted) : null;
                  return (
                    <div key={course} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "11px 13px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.heading }}>{course}</div>
                        {weighted !== null && (
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontSize: 11.5, color: COLORS.charcoal, opacity: 0.7 }}>{weighted}</span>
                            <span style={{ fontSize: 11.5, fontWeight: 700, padding: "2px 8px", borderRadius: 999, color: "#fff", background: letter === "FF" ? COLORS.rust : letter === "FD" || letter === "DD" || letter === "DC" ? COLORS.gold : COLORS.green }}>{letter}</span>
                          </div>
                        )}
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <input type="number" min="0" max="100" placeholder="Vize" value={g.vize || ""} onChange={(e) => updateGrade(course, "vize", e.target.value)} style={{ flex: 1, padding: "8px 10px", borderRadius: 5, border: `1px solid ${COLORS.line}`, fontSize: 12.5, background: COLORS.parchment, color: COLORS.body }} />
                        <input type="number" min="0" max="100" placeholder="Final" value={g.final || ""} onChange={(e) => updateGrade(course, "final", e.target.value)} style={{ flex: 1, padding: "8px 10px", borderRadius: 5, border: `1px solid ${COLORS.line}`, fontSize: 12.5, background: COLORS.parchment, color: COLORS.body }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Bottom Navigation */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: COLORS.surface, borderTop: `1px solid ${COLORS.line}`, display: "flex", padding: "10px 0 calc(10px + env(safe-area-inset-bottom))", zIndex: 100, overflowX: "auto", whiteSpace: "nowrap" }}>
            {[
              ["dersler", "Dersler"], ["kanunlar", "Kanunlar"], ["cards", "Kartlar"],
              ["pratik", "Pratik"], ["sozluk", "Sözlük"], ["pomodoro", "Odak"], ["topics", "Program"],
            ].map(([key, label]) => (
              <button key={key} onClick={() => { setTab(key); if (key !== "dersler") setSelectedCourse(null); if (key !== "cards") { setQuizMode(false); setQuiz(null); } }} style={{ flexShrink: 0, minWidth: "14%", flex: 1, background: "none", border: "none", fontSize: 10.5, fontWeight: 600, color: tab === key ? COLORS.bordo : "#9A9382", padding: "4px 2px" }}>
                {label}
              </button>
            ))}
          </div>

          {shareIntake && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(28,43,74,0.55)", zIndex: 260, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setShareIntake(null)}>
              <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.parchment, borderRadius: 12, padding: 20, width: "100%", maxWidth: 340 }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 700, color: COLORS.heading, marginBottom: 8 }}>📎 Bağlantı Paylaşıldı</div>
                <div style={{ fontSize: 11.5, color: COLORS.charcoal, opacity: 0.75, marginBottom: 14, wordBreak: "break-all", background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "8px 10px" }}>{shareIntake.url}</div>
                <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.bordo, marginBottom: 8 }}>Hangi derse eklensin?</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
                  {COURSES.map((c) => (
                    <button key={c} onClick={() => { setSelectedCourse(c); setResourceForm({ title: shareIntake.title || "Paylaşılan bağlantı", url: shareIntake.url, note: "", category: "Genel" }); setShowResourceForm(true); setTab("dersler"); setShareIntake(null); }} style={{ padding: "6px 12px", borderRadius: 999, fontSize: 11.5, fontWeight: 600, border: `1px solid ${COLORS.line}`, background: COLORS.surface, color: COLORS.charcoal }}>{c}</button>
                  ))}
                </div>
                <button onClick={() => setShareIntake(null)} style={{ width: "100%", padding: "10px 0", borderRadius: 6, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.charcoal, fontSize: 12.5 }}>Vazgeç</button>
              </div>
            </div>
          )}
        </div>

        <div id="print-sheet">
          {printCourse && (
            <div style={{ padding: "24px 30px", fontFamily: "Georgia, 'Times New Roman', serif", color: "#000" }}>
              <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 2 }}>{printCourse}</div>
              <div style={{ fontSize: 11, color: "#555", marginBottom: 16 }}>Muzo Hukuk — Fiş Özeti — {new Date().toLocaleDateString("tr-TR")}</div>
              <hr style={{ border: "none", borderTop: "1px solid #999", marginBottom: 16 }} />
              {cards.filter((c) => c.topic === printCourse).map((c, i) => (
                <div key={c.id} style={{ marginBottom: 16, breakInside: "avoid" }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>{i + 1}. {c.front}</div>
                  <div style={{ fontSize: 12.5, marginTop: 4, marginLeft: 18, color: "#222" }}>Cevap: {c.back}</div>
                  {c.statute && <div style={{ fontSize: 11, marginTop: 2, marginLeft: 18, color: "#555" }}>({c.statute})</div>}
                </div>
              ))}
            </div>
          )}
        </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HukukFisleri />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
