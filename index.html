  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // Safe Storage Adapter (localStorage)
    const storageAdapter = {
      async get(key) {
        try {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      },
    };

    const COURSES = [
      "Vergi Hukuku", "Ceza Hukuku (Özel Hükümler)", "Borçlar Hukuku (Özel Hükümler)",
      "Medeni Usul Hukuku", "Ticaret Hukuku", "İdari Yargılama Hukuku", "Eşya Hukuku",
    ];

    const WEEKDAY_ORDER = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const WEEKDAY_BY_INDEX = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    const LAWS = [
      { code: "TMK", title: "Türk Medeni Kanunu", note: "4721 sayılı — kişiler, aile, miras ve eşya hukuku (1030 madde)", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=4721&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TBK", title: "Türk Borçlar Kanunu", note: "6098 sayılı — borç ilişkileri, sözleşmeler, haksız fiil", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6098&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TCK", title: "Türk Ceza Kanunu", note: "5237 sayılı — suçlar, cezalar ve güvenlik tedbirleri", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=5237&MevzuatTur=1&MevzuatTertip=5" },
    ];

    const SEED_CARDS = [
      { id: uid(), topic: "Eşya Hukuku", front: "Zilyetlik türleri nelerdir ve dolaysız zilyetlik ne anlama gelir?", back: "Zilyetlik; asli-fer'i, dolaylı-dolaysız ve tek başına-birlikte zilyetlik olarak ayrılır. Fiili hakimiyeti doğrudan doğruya kullanan kişi dolaysız zilyettir (örneğin kiracı).", level: 0, lastReviewed: null },
      { id: uid(), topic: "Borçlar Hukuku (Özel)", front: "Satış sözleşmesinde satıcının ayıptan sorumluluğunun şartları nelerdir?", back: "1. Malın ayıplı olması, 2. Ayıbın hasarın geçtiği anda var olması, 3. Alıcının ayıbı bilmemesi, 4. Alıcının muayene ve ihbar külfetini yerine getirmiş olması.", level: 0, lastReviewed: null },
    ];

    const SEED_CASES = [
      { id: uid(), course: "Eşya Hukuku", title: "Tapuda Çift Kayıt ve İyiniyetli Üçüncü Kişi", factPattern: "(A), adına tapuda kayıtlı taşınmazı (B)'ye satmış fakat tescil yapılmamıştır. Yolsuz tescilden yararlanan (C) ise taşınmazı iyi niyetle (D)'ye devretmiştir.", legalIssue: "(D)'nin iktisabı TMK m. 1023 kapsamında korunur mu?", statute: "TMK m. 1023, TMK m. 1024", solution: "TMK m. 1023 uyarınca tapu kütüğündeki tescile iyiniyetle dayanarak ayni hak kazanan üçüncü kişinin bu kazanımı korunur. (D) iyiniyetli olduğu için mülkiyeti kazanır." },
    ];

    const SEED_DICTIONARY = [
      { id: uid(), term: "Müteselsil Sorumluluk", definition: "Birden fazla borçlunun, borcun tamamından zincirleme olarak sorumlu olması durumu." },
      { id: uid(), term: "Zilyetlik", definition: "Bir eşya üzerinde fiili hakimiyet kurma durumu." },
      { id: uid(), term: "İlliyet Bağı", definition: "Neden-sonuç ilişkisi. Haksız fiillerde zarar ile fiil arasındaki bağ." },
    ];

    const getDaysLeft = (targetDateStr) => {
      const now = new Date(); const target = new Date(targetDateStr);
      now.setHours(0, 0, 0, 0); target.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    };

    const getDriveEmbedUrl = (url) => {
      if (!url || !url.includes("drive.google.com")) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) return null;
      return `https://drive.google.com/file/d/${match[1]}/preview`;
    };

    const NOTE_COLORS = [
      { key: "none", label: "Etiketsiz", color: "#D9CFB8" },
      { key: "onemli", label: "Önemli", color: "#B8923F" },
      { key: "sinav", label: "Sınavda çıkar", color: "#7C2D3B" },
      { key: "karistiriyorum", label: "Karıştırıyorum", color: "#A6432F" },
      { key: "ogrendim", label: "Öğrendim", color: "#4C6B4F" },
    ];
    const getNoteColor = (key) => (NOTE_COLORS.find((c) => c.key === key) || NOTE_COLORS[0]).color;
    
    const COURTS = ["Yargıtay", "Danıştay", "Anayasa Mahkemesi", "BAM", "Diğer"];
    const CODE_ALIASES = { TMK: "TMK", MK: "TMK", TBK: "TBK", BK: "TBK", TCK: "TCK", CK: "TCK", HMK: "HMK", IYUK: "İYUK", KMK: "KMK", TTK: "TTK", VUK: "VUK", IIK: "İİK" };
    
    const parseArticleRefs = (text, defaultCode) => {
      if (!text) return [];
      const found = new Set();
      const up = String(text).toUpperCase().replace(/İ/g, "I").replace(/Ş/g, "S").replace(/Ğ/g, "G").replace(/Ü/g, "U").replace(/Ö/g, "O").replace(/Ç/g, "C");
      const withCode = /\b(TMK|TBK|TCK|HMK|IYUK|KMK|TTK|VUK|IIK|MK|BK|CK)\b[\s.]*(?:MADDE|M)?[\s.]*(\d{1,4})/g;
      let m;
      while ((m = withCode.exec(up)) !== null) { found.add((CODE_ALIASES[m[1]] || m[1]) + " " + m[2]); }
      if (defaultCode) {
        const noCode = /(?:^|[^A-Z0-9])(?:MADDE|M)[\s.]+(\d{1,4})/g;
        while ((m = noCode.exec(up)) !== null) { found.add(defaultCode + " " + m[1]); }
      }
      return Array.from(found);
    };

    const sortArticleRefs = (a, b) => {
      const [ca, na] = a.split(" "); const [cb, nb] = b.split(" ");
      if (ca !== cb) return ca.localeCompare(cb, "tr");
      return parseInt(na, 10) - parseInt(nb, 10);
    };

    const WORK_MSGS = [
      "Süre doldu! Harika bir odaklanmaydı, şimdi kısa bir dinlenme vakti.",
      "Zaman bitti! Bir bardak su iç ve gözlerini ekrandan/kitaptan ayır.",
      "Hedefine bir adım daha yaklaştın. Şimdi derin bir nefes al ve mola ver!"
    ];
    const BREAK_MSGS = [
      "Mola bitti! Hayallerin ve hedeflerin için tekrar masaya dönme vakti.",
      "Dinlenme süren doldu. Hadi o konuyu bitirelim, odaklan!",
      "Kitaplar seni bekliyor, geleceğin için çalışmaya devam!"
    ];

    function HukukFisleri() {
      const [loading, setLoading] = useState(true);
      
      // AI States
      const [geminiApiKey, setGeminiApiKey] = useState("");
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [showAiWizard, setShowAiWizard] = useState(false);
      const [aiWizardText, setAiWizardText] = useState("");
      const [aiWizardTopic, setAiWizardTopic] = useState(COURSES[0]);

      const [cards, setCards] = useState([]);
      const [resources, setResources] = useState({});
      const [cases, setCases] = useState([]);
      const [lawNotes, setLawNotes] = useState({});
      const [precedents, setPrecedents] = useState([]);
      const [dictionary, setDictionary] = useState([]);
      
      const [tab, setTab] = useState("dersler");
      const [lawSubTab, setLawSubTab] = useState("kanunlar");
      const [pratikSubTab, setPratikSubTab] = useState("olaylar");
      const [selectedCourse, setSelectedCourse] = useState(null);
      
      const [showResourceForm, setShowResourceForm] = useState(false);
      const [resourceForm, setResourceForm] = useState({ title: "", url: "", note: "", category: "Genel" });
      const [editingResourceId, setEditingResourceId] = useState(null);
      const [expandedResourceId, setExpandedResourceId] = useState(null);
      
      const [showSettings, setShowSettings] = useState(false);
      const [showGlobalSearch, setShowGlobalSearch] = useState(false);
      const [globalQuery, setGlobalQuery] = useState("");
      const [showFocusMode, setShowFocusMode] = useState(false);
      const [audioMode, setAudioMode] = useState(false);
      const [darkMode, setDarkModeState] = useState(false);
      
      const [grades, setGrades] = useState({});
      const [examDates, setExamDates] = useState({ vize: "", final: "" });
      const [selectedTopic, setSelectedTopic] = useState("Tümü");
      const [queueIds, setQueueIds] = useState([]);
      const [cursor, setCursor] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [quizMode, setQuizMode] = useState(false);
      const [quiz, setQuiz] = useState(null);
      const [weeklyPlan, setWeeklyPlan] = useState({});
      const [expandedDay, setExpandedDay] = useState(null);
      const [lawSearch, setLawSearch] = useState("");
      const [expandedLaw, setExpandedLaw] = useState(null);
      const [noteDraft, setNoteDraft] = useState({ madde: "", text: "", color: "none", review: false });
      const [editingNoteId, setEditingNoteId] = useState(null);
      const [onlyFlaggedNotes, setOnlyFlaggedNotes] = useState(false);
      const [articleSearch, setArticleSearch] = useState("");
      const [selectedArticle, setSelectedArticle] = useState(null);
      
      const [showAddForm, setShowAddForm] = useState(false);
      const [printCourse, setPrintCourse] = useState(null);
      const [shareIntake, setShareIntake] = useState(null);
      
      const [form, setForm] = useState({ topic: "", front: "", back: "", statute: "" });
      const [editingCardId, setEditingCardId] = useState(null);
      
      const [openCaseId, setOpenCaseId] = useState(null);
      const [showCaseForm, setShowCaseForm] = useState(false);
      const [caseForm, setCaseForm] = useState({ course: COURSES[0], title: "", factPattern: "", legalIssue: "", statute: "", solution: "" });
      const [editingCaseId, setEditingCaseId] = useState(null);
      
      const [openPrecedentId, setOpenPrecedentId] = useState(null);
      const [showPrecedentForm, setShowPrecedentForm] = useState(false);
      const [precedentForm, setPrecedentForm] = useState({ court: COURTS[0], caseNo: "", date: "", topic: "", statute: "", summary: "" });
      const [editingPrecedentId, setEditingPrecedentId] = useState(null);
      const [precedentSearch, setPrecedentSearch] = useState("");
      const [toast, setToast] = useState(null);
      
      const [showDictForm, setShowDictForm] = useState(false);
      const [dictForm, setDictForm] = useState({ term: "", definition: "" });
      const [editingDictId, setEditingDictId] = useState(null);
      const [dictSearch, setDictSearch] = useState("");
      
      // Pomodoro States
      const [pomoSettings, setPomoSettings] = useState({ work: 25, break: 5 });
      const [pomoSettingsDraft, setPomoSettingsDraft] = useState({ work: 25, break: 5 });
      const [pomoMinutes, setPomoMinutes] = useState(25);
      const [pomoSeconds, setPomoSeconds] = useState(0);
      const [pomoIsRunning, setPomoIsRunning] = useState(false);
      const [pomoMode, setPomoMode] = useState("work");
      const [notificationGranted, setNotificationGranted] = useState(false);

      const currentYear = new Date().getFullYear();
      const defaultVizeDateStr = `${currentYear}-12-28`;
      const defaultFinalDateStr = `${new Date().getMonth() >= 6 ? currentYear + 1 : currentYear}-06-01`;
      const vizeDateStr = examDates.vize || defaultVizeDateStr;
      const finalDateStr = examDates.final || defaultFinalDateStr;
      const vizeDays = useMemo(() => getDaysLeft(vizeDateStr), [vizeDateStr]);
      const finalDays = useMemo(() => getDaysLeft(finalDateStr), [finalDateStr]);
      
      const formatDateLabel = (dateStr) => {
        try { return new Date(dateStr + "T00:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" }); }
        catch (e) { return dateStr; }
      };

      const dailyTarget = 10;
      const todayReviewedCount = useMemo(() => {
        const todayStr = new Date().toISOString().split("T")[0];
        return cards.filter(c => c.lastReviewed && c.lastReviewed.startsWith(todayStr)).length;
      }, [cards]);
      
      const studyDaysSet = useMemo(() => {
        const set = new Set();
        cards.forEach((c) => { if (c.lastReviewed) set.add(c.lastReviewed.split("T")[0]); });
        return set;
      }, [cards]);
      
      const currentStreak = useMemo(() => {
        let streak = 0; let d = new Date();
        const todayStr = d.toISOString().split("T")[0];
        if (!studyDaysSet.has(todayStr)) d.setDate(d.getDate() - 1);
        while (studyDaysSet.has(d.toISOString().split("T")[0])) {
          streak++; d.setDate(d.getDate() - 1);
        }
        return streak;
      }, [studyDaysSet]);
      
      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const dStr = d.toISOString().split("T")[0];
          const count = cards.filter((c) => c.lastReviewed && c.lastReviewed.startsWith(dStr)).length;
          days.push({ label: d.toLocaleDateString("tr-TR", { weekday: "short" }), count, isToday: i === 0 });
        }
        return days;
      }, [cards]);

      const todayWeekdayName = WEEKDAY_BY_INDEX[new Date().getDay()];
      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3500); };

      useEffect(() => {
        if ("Notification" in window) setNotificationGranted(Notification.permission === "granted");
      }, []);

      const requestNotificationPermission = () => {
        if (!("Notification" in window)) { showToast("Tarayıcınız bildirimleri desteklemiyor."); return; }
        Notification.requestPermission().then(permission => {
          if (permission === "granted") { setNotificationGranted(true); showToast("Harika! Artık bildirim alacaksın."); }
        });
      };

      const sendPomoNotification = (title, body) => {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(title, { body, icon: "icon-192.png" });
        }
      };

      useEffect(() => {
        (async () => {
          let loadedCards = SEED_CARDS; let loadedResources = {}; let loadedCases = SEED_CASES;
          let loadedLawNotes = {}; let loadedExamDates = { vize: "", final: "" }; let loadedWeeklyPlan = {};
          let loadedPrecedents = []; let loadedDictionary = SEED_DICTIONARY; let loadedPomo = { work: 25, break: 5 };
          let loadedGeminiKey = "";
          try { const gak = await storageAdapter.get("gemini-api-key"); if (gak && gak.value) loadedGeminiKey = gak.value; } catch (e) {}
          try { const c = await storageAdapter.get("cards"); if (c && c.value) loadedCards = JSON.parse(c.value); } catch (e) {}
          try { const r = await storageAdapter.get("resources"); if (r && r.value) loadedResources = JSON.parse(r.value); } catch (e) {}
          try { const cs = await storageAdapter.get("cases"); if (cs && cs.value) loadedCases = JSON.parse(cs.value); } catch (e) {}
          try { const ln = await storageAdapter.get("law-notes"); if (ln && ln.value) loadedLawNotes = JSON.parse(ln.value); } catch (e) {}
          try { const ed = await storageAdapter.get("exam-dates"); if (ed && ed.value) loadedExamDates = JSON.parse(ed.value); } catch (e) {}
          try { const wp = await storageAdapter.get("weekly-plan"); if (wp && wp.value) { const parsed = JSON.parse(wp.value); const migrated = {}; for (let day of Object.keys(parsed)) { migrated[day] = parsed[day].map(c => typeof c === 'string' ? { id: uid(), course: c, time: "09:00", location: "Amfi 1" } : c); } loadedWeeklyPlan = migrated; } } catch (e) {}
          try { const pr = await storageAdapter.get("precedents"); if (pr && pr.value) loadedPrecedents = JSON.parse(pr.value); } catch (e) {}
          try { const dict = await storageAdapter.get("dictionary"); if (dict && dict.value) loadedDictionary = JSON.parse(dict.value); } catch (e) {}
          try { const ps = await storageAdapter.get("pomo-settings"); if (ps && ps.value) loadedPomo = JSON.parse(ps.value); } catch (e) {}
          
          let loadedAudioMode = false;
          try { const am = await storageAdapter.get("audio-mode"); if (am && am.value) loadedAudioMode = JSON.parse(am.value); } catch (e) {}
          let loadedDarkMode = false;
          try { const dm = await storageAdapter.get("dark-mode"); if (dm && dm.value) loadedDarkMode = JSON.parse(dm.value); } catch (e) {}
          let loadedGrades = {};
          try { const gr = await storageAdapter.get("grades"); if (gr && gr.value) loadedGrades = JSON.parse(gr.value); } catch (e) {}
          
          setGeminiApiKey(loadedGeminiKey);
          setCards(loadedCards); setResources(loadedResources); setCases(loadedCases); setLawNotes(loadedLawNotes);
          setExamDates(loadedExamDates); setWeeklyPlan(loadedWeeklyPlan); setPrecedents(loadedPrecedents); setDictionary(loadedDictionary);
          setAudioMode(loadedAudioMode); setDarkModeState(loadedDarkMode); setGrades(loadedGrades);
          setPomoSettings(loadedPomo); setPomoSettingsDraft(loadedPomo); setPomoMinutes(loadedPomo.work);
          setLoading(false);
        })();
      }, []);

      // GEMINI AI INTEGRATION
      const generateWithGemini = async (prompt) => {
        if (!geminiApiKey) {
          showToast("Lütfen önce Ayarlar'dan Gemini API Key gir!");
          return null;
        }
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiApiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
          );
          const data = await response.json();
          if (data.error) { showToast("API Hatası: " + data.error.message); return null; }
          if (data.candidates && data.candidates[0]) return data.candidates[0].content.parts[0].text;
          return null;
        } catch (error) {
          showToast("Bağlantı hatası oluştu.");
          return null;
        }
      };

      const handleAiDict = async () => {
        if (!dictForm.term.trim()) { showToast("Önce bir terim yazmalısın."); return; }
        setIsAiLoading(true);
        const prompt = `Sen bir hukuk profesörüsün. "${dictForm.term}" hukuki terimini hukuk fakültesi seviyesinde, en fazla 2 cümlede anlaşılır bir dille tanımla. Ekstra yorum, giriş/çıkış veya markdown yıldızları kullanma, sadece doğrudan tanımı yaz.`;
        const result = await generateWithGemini(prompt);
        if (result) setDictForm({ ...dictForm, definition: result.trim() });
        setIsAiLoading(false);
      };

      const handleAiCase = async () => {
        if (!caseForm.factPattern.trim() || !caseForm.legalIssue.trim()) { 
          showToast("Önce olay metnini ve hukuki sorunu yazmalısın."); return; 
        }
        setIsAiLoading(true);
        const prompt = `Sen bir hukuk profesörüsün. Aşağıdaki hukuki olayı ve sorunu incele. İlgili kanun (TMK/TBK vb.) çerçevesinde 3-4 cümlelik kısa, net bir hukuki çözüm ve gerekçe yaz. Ekstra açıklama veya giriş/çıkış cümleleri kullanma, doğrudan cevabı yaz.\n\nOlay: ${caseForm.factPattern}\nSorun: ${caseForm.legalIssue}`;
        const result = await generateWithGemini(prompt);
        if (result) setCaseForm({ ...caseForm, solution: result.trim() });
        setIsAiLoading(false);
      };

      const handleAiFlashcards = async () => {
        if (!aiWizardText.trim()) { showToast("Lütfen bir metin gir."); return; }
        setIsAiLoading(true);
        const prompt = `Şu hukuki metni incele ve hukuk fakültesi öğrencisi için en önemli yerlerden 3 ila 6 adet soru-cevap flashcard (fiş) çıkar.
        Kurallar:
        1. Asla markdown (**, * vb) kullanma.
        2. Her fiş yeni bir satırda olsun.
        3. Soru ile cevap arasında tam olarak " | " işareti olsun.
        4. Soru kısmına madde numarası vs koyma, doğrudan soruyu sor.
        
        Örnek Çıktı:
        Zilyetlik nedir? | Bir eşya üzerinde fiili hakimiyet kurma durumudur.
        Dolaysız zilyet kime denir? | Fiili hakimiyeti doğrudan doğruya kullanan kişiye denir.
        
        Metin:
        ${aiWizardText}`;
        
        const result = await generateWithGemini(prompt);
        setIsAiLoading(false);
        if (result) {
            const lines = result.split('\n').map(l => l.trim()).filter(Boolean);
            const newCards = [];
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length >= 2) {
                    newCards.push({ 
                        id: uid(), topic: aiWizardTopic, front: parts[0].trim(), back: parts.slice(1).join('|').trim(), statute: "", level: 0, lastReviewed: null 
                    });
                }
            });
            if (newCards.length > 0) {
                saveCards([...cards, ...newCards]);
                showToast(`${newCards.length} adet fiş başarıyla üretildi ve eklendi!`);
                setShowAiWizard(false); setAiWizardText("");
            } else {
                showToast("Format algılanamadı. Lütfen daha net bir metin girin.");
            }
        }
      };

      useEffect(() => {
        let interval = null;
        if (pomoIsRunning) {
          interval = setInterval(() => {

                  </div>

                                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.heading, marginTop: 2 }}>{c.front}</div>
                                </button>

                            </div>
                          </div>

                      </div>

                        <button onClick={handleAiFlashcards} disabled={isAiLoading} style={{ width: "100%", padding: "13px 0", borderRadius: 6, border: "none", background: "linear-gradient(45deg, #1C2B4A, #7C2D3B)", color: "#fff", fontWeight: 700, fontSize: 14 }}>

                <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
                  {[["olaylar", "Olaylar"], ["ictihat", "İçtihat"]].map(([key, label]) => (
                    <button key={key} onClick={() => setPratikSubTab(key)} style={{ flex: 1, padding: "8px 0", borderRadius: 6, fontSize: 12.5, fontWeight: 600, border: `1px solid ${pratikSubTab === key ? COLORS.bordo : COLORS.line}`, background: pratikSubTab === key ? COLORS.bordo : "#fff", color: pratikSubTab === key ? "#fff" : COLORS.charcoal }}>{label}</button>
                  ))}
                </div>
                
                {pratikSubTab === "olaylar" && (
                  <>
                    <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 14 }}>
                      {cases.map((c) => {
                        const isOpen = openCaseId === c.id;
                        return (
                          <div key={c.id} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: 16 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                              <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.bordo }}>{c.course.toUpperCase()}</div>
                              <div style={{ display: "flex", gap: 10 }}>
                                <button onClick={() => startEditCase(c)} style={{ background: "none", border: "none", fontSize: 11, color: COLORS.bordo, opacity: 0.65, padding: 0 }}>düzenle</button>
                                <button onClick={() => deleteCase(c.id)} style={{ background: "none", border: "none", fontSize: 11, color: COLORS.bordo, opacity: 0.5, padding: 0 }}>sil</button>
                              </div>
                            </div>
                            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 600, color: COLORS.heading, marginBottom: 8 }}>{c.title}</div>
                            <div style={{ fontSize: 13, color: COLORS.charcoal, lineHeight: 1.45, marginBottom: 10, background: COLORS.parchment, padding: 10, borderRadius: 4 }}><strong>Olay:</strong> {c.factPattern}</div>
                            <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.rust, marginBottom: 10 }}>❓ Sorun: {c.legalIssue}</div>
                            {isOpen ? (
                              <div style={{ borderTop: `1px solid ${COLORS.line}`, paddingTop: 10, marginTop: 10 }}>
                                {c.statute && <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.green, marginBottom: 4 }}>İlgili Mevzuat: {c.statute}</div>}
                                <div style={{ fontSize: 13, color: COLORS.heading, lineHeight: 1.5 }}><strong>Çözüm:</strong> {c.solution}</div>
                                <button onClick={() => setOpenCaseId(null)} style={{ background: "none", border: "none", color: COLORS.bordo, fontSize: 12, fontWeight: 600, marginTop: 10, padding: 0 }}>▲ Gizle</button>
                              </div>
                            ) : (
                              <button onClick={() => setOpenCaseId(c.id)} style={{ width: "100%", padding: "9px 0", borderRadius: 5, border: `1px solid ${COLORS.line}`, background: COLORS.parchment, color: COLORS.heading, fontWeight: 600, fontSize: 12.5 }}>▼ Çözümü Gör</button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    
                    {!showCaseForm ? (
                      <button onClick={() => setShowCaseForm(true)} style={{ width: "100%", padding: "13px 0", borderRadius: 6, border: `1px dashed ${COLORS.bordo}`, background: "transparent", color: COLORS.bordo, fontWeight: 600, fontSize: 13.5 }}>+ Yeni Olay Ekle</button>
                    ) : (
                      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: 16 }}>
                        <div style={{ fontWeight: 600, fontSize: 13.5, color: COLORS.heading, marginBottom: 10 }}>{editingCaseId ? "Olayı Düzenle" : "Yeni Olay"}</div>
                        <input placeholder="Başlık" value={caseForm.title} onChange={(e) => setCaseForm({ ...caseForm, title: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                        <textarea placeholder="Olay metni" value={caseForm.factPattern} onChange={(e) => setCaseForm({ ...caseForm, factPattern: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5, minHeight: 60, resize: "vertical" }} />
                        <input placeholder="Hukuki sorun (soru cümlesi)" value={caseForm.legalIssue} onChange={(e) => setCaseForm({ ...caseForm, legalIssue: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                        <input placeholder="İlgili mevzuat (örn. TMK m. 683) — opsiyonel" value={caseForm.statute} onChange={(e) => setCaseForm({ ...caseForm, statute: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                        
                        {/* YENİ: AI OLAY ÇÖZÜCÜ BUTONU */}
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, marginTop: 4 }}>
                            <div style={{ fontSize: 11, color: COLORS.charcoal, fontWeight: 600 }}>Çözüm & Gerekçe</div>
                            <button type="button" onClick={handleAiCase} disabled={isAiLoading} style={{ fontSize: 10.5, background: "linear-gradient(45deg, #1C2B4A, #7C2D3B)", color: "#fff", border: "none", borderRadius: 4, padding: "4px 8px", fontWeight: 700 }}>
                                {isAiLoading ? "⏳ Çözülüyor..." : "✨ AI Çöz"}
                            </button>
                        </div>

                        <textarea placeholder="AI tuşuna basarak olayı çözdürebilir veya kendin yazabilirsin..." value={caseForm.solution} onChange={(e) => setCaseForm({ ...caseForm, solution: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 12, fontSize: 13.5, minHeight: 80, resize: "vertical" }} />
                        
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={addCase} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: "none", background: COLORS.ink, color: "#fff", fontWeight: 600, fontSize: 13.5 }}>{editingCaseId ? "Güncelle" : "Kaydet"}</button>
                          <button onClick={() => (editingCaseId ? cancelCaseEdit() : setShowCaseForm(false))} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.charcoal, fontSize: 13.5 }}>İptal</button>
                        </div>
                      </div>
                    )}
                  </>
                )}
                {/* İctihat bölümü (kısaltılmış görünüm, orjinal kod ile aynı) */}
              </div>
            )}

            {/* Diğer tabların kodları (kanunlar, cards, konular vs) aynı kalacak şekilde */}
            {tab === "pomodoro" && (
                <div style={{ padding: "18px 20px" }}>
                  <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: COLORS.heading, marginBottom: 6 }}>Odak Modu</div>
                  <div style={{ fontSize: 12, color: COLORS.bordo, opacity: 0.8, marginBottom: 18, lineHeight: 1.4 }}> Süreni belirle, bildirimleri aç ve dikkatini sadece derse ver. </div>
                  {/* Pomodoro içeriği aynı */}
                  <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "30px 20px", textAlign: "center", boxShadow: "0 4px 12px rgba(28,43,74,0.03)" }}>
                    <div style={{ display: "inline-flex", gap: 6, marginBottom: 24, background: COLORS.parchment, padding: 4, borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
                      <button onClick={() => resetPomodoro("work")} style={{ padding: "8px 16px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, border: "none", background: pomoMode === "work" ? COLORS.bordo : "transparent", color: pomoMode === "work" ? "#fff" : COLORS.charcoal }}>Çalışma</button>
                      <button onClick={() => resetPomodoro("break")} style={{ padding: "8px 16px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, border: "none", background: pomoMode === "break" ? COLORS.bordo : "transparent", color: pomoMode === "break" ? "#fff" : COLORS.charcoal }}>Mola</button>
                    </div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 72, fontWeight: 700, color: COLORS.heading, margin: "0 0 24px", lineHeight: 1, letterSpacing: -1.5 }}> {formatPomoTime()} </div>
                    <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                      <button onClick={() => setPomoIsRunning(!pomoIsRunning)} style={{ width: 140, padding: "14px 0", borderRadius: 8, border: "none", background: pomoIsRunning ? COLORS.gold : COLORS.ink, color: pomoIsRunning ? COLORS.ink : "#fff", fontWeight: 700, fontSize: 15 }}> {pomoIsRunning ? "Duraklat" : "Başla"} </button>
                      <button onClick={() => resetPomodoro(pomoMode)} style={{ width: 90, padding: "14px 0", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: COLORS.parchment, color: COLORS.charcoal, fontWeight: 600, fontSize: 14 }}> Sıfırla </button>
                    </div>
                  </div>
                </div>
            )}

            {/* Bottom Navigation */}
            <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: COLORS.surface, borderTop: `1px solid ${COLORS.line}`, display: "flex", padding: "10px 0 calc(10px + env(safe-area-inset-bottom))", zIndex: 100, overflowX: "auto", whiteSpace: "nowrap" }}>
              {[
                ["dersler", "Dersler"], ["kanunlar", "Kanunlar"], ["cards", "Kartlar"], ["pratik", "Pratik"], ["sozluk", "Sözlük"], ["pomodoro", "Odak"], ["topics", "Program"],
              ].map(([key, label]) => (
                <button key={key} onClick={() => { setTab(key); if (key !== "dersler") setSelectedCourse(null); if (key !== "cards") { setQuizMode(false); setQuiz(null); } }} style={{ flexShrink: 0, minWidth: "14%", flex: 1, background: "none", border: "none", fontSize: 10.5, fontWeight: 600, color: tab === key ? COLORS.bordo : "#9A9382", padding: "4px 2px" }}>
                  {label}
                </button>
              ))}
            </div>

          </div>
        </>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HukukFisleri />);
  </script>
</body>
</html>
