<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzo Hukuk - 3. Sınıf</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1C2B4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muzo Hukuk">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.0/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F6F1E4;
      font-family: 'IBM Plex Sans', sans-serif;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // Safe Storage Adapter (localStorage) — bu dosya doğrudan tarayıcıda açıldığında çalışır
    const storageAdapter = {
      async get(key) {
        try {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        } catch (e) {
          return null;
        }
      },
      async set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {}
      },
    };

    const COURSES = [
      "Vergi Hukuku",
      "Ceza Hukuku (Özel Hükümler)",
      "Borçlar Hukuku (Özel Hükümler)",
      "Medeni Usul Hukuku",
      "Ticaret Hukuku",
      "İdari Yargılama Hukuku",
      "Eşya Hukuku",
    ];

    const WEEKDAY_ORDER = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const WEEKDAY_BY_INDEX = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"]; // JS Date.getDay(): 0=Pazar

    const LAWS = [
      {
        code: "TMK",
        title: "Türk Medeni Kanunu",
        note: "4721 sayılı — kişiler, aile, miras ve eşya hukuku (1030 madde)",
        url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=4721&MevzuatTur=1&MevzuatTertip=5",
      },
      {
        code: "TBK",
        title: "Türk Borçlar Kanunu",
        note: "6098 sayılı — borç ilişkileri, sözleşmeler, haksız fiil",
        url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6098&MevzuatTur=1&MevzuatTertip=5",
      },
      {
        code: "TCK",
        title: "Türk Ceza Kanunu",
        note: "5237 sayılı — suçlar, cezalar ve güvenlik tedbirleri",
        url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=5237&MevzuatTur=1&MevzuatTertip=5",
      },
    ];

    const SEED_CARDS = [
      {
        id: uid(),
        topic: "Eşya Hukuku",
        front: "Zilyetlik türleri nelerdir ve dolaysız zilyetlik ne anlama gelir?",
        back: "Zilyetlik; asli-fer'i, dolaylı-dolaysız ve tek başına-birlikte zilyetlik olarak ayrılır. Fiili hakimiyeti doğrudan doğruya kullanan kişi dolaysız zilyettir (örneğin kiracı).",
        level: 0,
        lastReviewed: null,
      },
      {
        id: uid(),
        topic: "Borçlar Hukuku (Özel)",
        front: "Satış sözleşmesinde satıcının ayıptan sorumluluğunun şartları nelerdir?",
        back: "1. Malın ayıplı olması, 2. Ayıbın hasarın geçtiği anda var olması, 3. Alıcının ayıbı bilmemesi, 4. Alıcının muayene ve ihbar külfetini yerine getirmiş olması.",
        level: 0,
        lastReviewed: null,
      },
    ];

    const SEED_CASES = [
      {
        id: uid(),
        course: "Eşya Hukuku",
        title: "Tapuda Çift Kayıt ve İyiniyetli Üçüncü Kişi",
        factPattern: "(A), adına tapuda kayıtlı taşınmazı (B)'ye satmış fakat tescil yapılmamıştır. Yolsuz tescilden yararlanan (C) ise taşınmazı iyi niyetle (D)'ye devretmiştir.",
        legalIssue: "(D)'nin iktisabı TMK m. 1023 kapsamında korunur mu?",
        statute: "TMK m. 1023, TMK m. 1024",
        solution: "TMK m. 1023 uyarınca tapu kütüğündeki tescile iyiniyetle dayanarak ayni hak kazanan üçüncü kişinin bu kazanımı korunur. (D) iyiniyetli olduğu için mülkiyeti kazanır.",
      },
    ];

    // Gün Hesaplama Fonksiyonu
    const getDaysLeft = (targetDateStr) => {
      const now = new Date();
      const target = new Date(targetDateStr);
      now.setHours(0, 0, 0, 0);
      target.setHours(0, 0, 0, 0);
      const diffTime = target - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    };

    // Google Drive paylaşım linkini uygulama içinde gömülebilir (iframe) linke çevirir
    const getDriveEmbedUrl = (url) => {
      if (!url || !url.includes("drive.google.com")) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) return null;
      return `https://drive.google.com/file/d/${match[1]}/preview`;
    };

    function HukukFisleri() {
      const [loading, setLoading] = useState(true);
      const [cards, setCards] = useState([]);
      const [resources, setResources] = useState({});
      const [cases, setCases] = useState([]);
      const [lawNotes, setLawNotes] = useState({});

      const [tab, setTab] = useState("dersler");
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [showResourceForm, setShowResourceForm] = useState(false);
      const [resourceForm, setResourceForm] = useState({ title: "", url: "", note: "", category: "Genel" });
      const [expandedResourceId, setExpandedResourceId] = useState(null);

      const [showSettings, setShowSettings] = useState(false);
      const [examDates, setExamDates] = useState({ vize: "", final: "" });

      const [selectedTopic, setSelectedTopic] = useState("Tümü");
      const [queueIds, setQueueIds] = useState([]);
      const [cursor, setCursor] = useState(0);
      const [flipped, setFlipped] = useState(false);

      const [quizMode, setQuizMode] = useState(false);
      const [quiz, setQuiz] = useState(null);

      const [weeklyPlan, setWeeklyPlan] = useState({});
      const [expandedDay, setExpandedDay] = useState(null);

      const [lawSearch, setLawSearch] = useState("");
      const [expandedLaw, setExpandedLaw] = useState(null);
      const [noteDraft, setNoteDraft] = useState({ madde: "", text: "" });

      const [showAddForm, setShowAddForm] = useState(false);
      const [form, setForm] = useState({ topic: "", front: "", back: "" });

      const [openCaseId, setOpenCaseId] = useState(null);
      const [showCaseForm, setShowCaseForm] = useState(false);
      const [caseForm, setCaseForm] = useState({ course: COURSES[0], title: "", factPattern: "", legalIssue: "", statute: "", solution: "" });
      const [toast, setToast] = useState(null);

      // Sınav Tarihleri Hesaplaması — kullanıcı Ayarlar'dan değiştirmediyse varsayılan tarihler kullanılır
      const currentYear = new Date().getFullYear();
      const defaultVizeDateStr = `${currentYear}-12-28`;
      const finalYear = new Date().getMonth() >= 6 ? currentYear + 1 : currentYear;
      const defaultFinalDateStr = `${finalYear}-06-01`;

      const vizeDateStr = examDates.vize || defaultVizeDateStr;
      const finalDateStr = examDates.final || defaultFinalDateStr;

      const vizeDays = useMemo(() => getDaysLeft(vizeDateStr), [vizeDateStr]);
      const finalDays = useMemo(() => getDaysLeft(finalDateStr), [finalDateStr]);

      const formatDateLabel = (dateStr) => {
        try {
          const d = new Date(dateStr + "T00:00:00");
          return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
        } catch (e) { return dateStr; }
      };

      // Bugün Gözden Geçirilen Fiş Sayısı (Günlük Hedef: 10 Fiş)
      const dailyTarget = 10;
      const todayReviewedCount = useMemo(() => {
        const todayStr = new Date().toISOString().split("T")[0];
        return cards.filter(c => c.lastReviewed && c.lastReviewed.startsWith(todayStr)).length;
      }, [cards]);

      // Çalışma Serisi (Streak) — fiş tekrarı yapılan günlerden hesaplanır, ayrı bir kayıt gerekmez
      const studyDaysSet = useMemo(() => {
        const set = new Set();
        cards.forEach((c) => { if (c.lastReviewed) set.add(c.lastReviewed.split("T")[0]); });
        return set;
      }, [cards]);

      const currentStreak = useMemo(() => {
        let streak = 0;
        let d = new Date();
        const todayStr = d.toISOString().split("T")[0];
        if (!studyDaysSet.has(todayStr)) d.setDate(d.getDate() - 1);
        while (studyDaysSet.has(d.toISOString().split("T")[0])) {
          streak++;
          d.setDate(d.getDate() - 1);
        }
        return streak;
      }, [studyDaysSet]);

      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dStr = d.toISOString().split("T")[0];
          const count = cards.filter((c) => c.lastReviewed && c.lastReviewed.startsWith(dStr)).length;
          days.push({ label: d.toLocaleDateString("tr-TR", { weekday: "short" }), count, isToday: i === 0 });
        }
        return days;
      }, [cards]);

      const todayWeekdayName = WEEKDAY_BY_INDEX[new Date().getDay()];

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        (async () => {
          let loadedCards = SEED_CARDS;
          let loadedResources = {};
          let loadedCases = SEED_CASES;
          let loadedLawNotes = {};
          let loadedExamDates = { vize: "", final: "" };
          let loadedWeeklyPlan = {};

          try {
            const c = await storageAdapter.get("cards");
            if (c && c.value) loadedCards = JSON.parse(c.value);
          } catch (e) {}

          try {
            const r = await storageAdapter.get("resources");
            if (r && r.value) loadedResources = JSON.parse(r.value);
          } catch (e) {}

          try {
            const cs = await storageAdapter.get("cases");
            if (cs && cs.value) loadedCases = JSON.parse(cs.value);
          } catch (e) {}

          try {
            const ln = await storageAdapter.get("law-notes");
            if (ln && ln.value) loadedLawNotes = JSON.parse(ln.value);
          } catch (e) {}

          try {
            const ed = await storageAdapter.get("exam-dates");
            if (ed && ed.value) loadedExamDates = JSON.parse(ed.value);
          } catch (e) {}

          try {
            const wp = await storageAdapter.get("weekly-plan");
            if (wp && wp.value) loadedWeeklyPlan = JSON.parse(wp.value);
          } catch (e) {}

          setCards(loadedCards);
          setResources(loadedResources);
          setCases(loadedCases);
          setLawNotes(loadedLawNotes);
          setExamDates(loadedExamDates);
          setWeeklyPlan(loadedWeeklyPlan);
          setLoading(false);
        })();
      }, []);

      const saveCards = useCallback(async (next) => {
        setCards(next);
        await storageAdapter.set("cards", JSON.stringify(next));
      }, []);

      const saveResources = useCallback(async (next) => {
        setResources(next);
        await storageAdapter.set("resources", JSON.stringify(next));
      }, []);

      const saveCases = useCallback(async (next) => {
        setCases(next);
        await storageAdapter.set("cases", JSON.stringify(next));
      }, []);

      const saveWeeklyPlan = useCallback(async (next) => {
        setWeeklyPlan(next);
        await storageAdapter.set("weekly-plan", JSON.stringify(next));
      }, []);

      const toggleDayCourse = (day, course) => {
        const current = weeklyPlan[day] || [];
        const next = current.includes(course) ? current.filter((c) => c !== course) : [...current, course];
        saveWeeklyPlan({ ...weeklyPlan, [day]: next });
      };

      const saveLawNotes = useCallback(async (next) => {
        setLawNotes(next);
        await storageAdapter.set("law-notes", JSON.stringify(next));
      }, []);

      const saveExamDates = useCallback(async (next) => {
        setExamDates(next);
        await storageAdapter.set("exam-dates", JSON.stringify(next));
      }, []);

      // ---- Yedekle / Geri Yükle ----
      const exportBackup = () => {
        const payload = {
          app: "muzo-hukuk",
          version: 1,
          exportedAt: new Date().toISOString(),
          cards, resources, cases, lawNotes, examDates, weeklyPlan,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `muzo-hukuk-yedek-${new Date().toISOString().split("T")[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Yedek indirildi.");
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data || data.app !== "muzo-hukuk") {
              showToast("Bu bir Muzo Hukuk yedek dosyası değil.");
              return;
            }
            if (data.cards) await saveCards(data.cards);
            if (data.resources) await saveResources(data.resources);
            if (data.cases) await saveCases(data.cases);
            if (data.lawNotes) await saveLawNotes(data.lawNotes);
            if (data.examDates) await saveExamDates(data.examDates);
            if (data.weeklyPlan) await saveWeeklyPlan(data.weeklyPlan);
            showToast("Yedek geri yüklendi!");
            setShowSettings(false);
          } catch (err) {
            showToast("Dosya okunamadı, geçerli bir JSON yedeği olmalı.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      const addResource = () => {
        if (!resourceForm.title.trim()) {
          showToast("Kaynak adı gerekli.");
          return;
        }
        const list = resources[selectedCourse] || [];
        const newRes = {
          id: uid(),
          title: resourceForm.title.trim(),
          url: resourceForm.url.trim(),
          note: resourceForm.note.trim(),
          category: resourceForm.category || "Genel",
        };
        saveResources({ ...resources, [selectedCourse]: [...list, newRes] });
        setResourceForm({ title: "", url: "", note: "", category: resourceForm.category });
        setShowResourceForm(false);
        showToast("Kaynak eklendi.");
      };

      const deleteResource = (course, id) => {
        saveResources({ ...resources, [course]: (resources[course] || []).filter((r) => r.id !== id) });
        showToast("Kaynak silindi.");
      };

      const addCase = () => {
        if (!caseForm.title.trim() || !caseForm.factPattern.trim()) {
          showToast("Başlık ve olay metni gerekli.");
          return;
        }
        const newCase = {
          id: uid(),
          course: caseForm.course || "Genel",
          title: caseForm.title.trim(),
          factPattern: caseForm.factPattern.trim(),
          legalIssue: caseForm.legalIssue.trim(),
          statute: caseForm.statute.trim(),
          solution: caseForm.solution.trim(),
        };
        saveCases([...cases, newCase]);
        setCaseForm({ course: caseForm.course, title: "", factPattern: "", legalIssue: "", statute: "", solution: "" });
        setShowCaseForm(false);
        showToast("Olay eklendi.");
      };

      const deleteCase = (id) => {
        saveCases(cases.filter((c) => c.id !== id));
        showToast("Olay silindi.");
      };

      const addLawNote = (code) => {
        if (!noteDraft.text.trim()) {
          showToast("Not metni boş olamaz.");
          return;
        }
        const list = lawNotes[code] || [];
        const newNote = { id: uid(), madde: noteDraft.madde.trim(), text: noteDraft.text.trim(), date: new Date().toISOString() };
        saveLawNotes({ ...lawNotes, [code]: [...list, newNote] });
        setNoteDraft({ madde: "", text: "" });
        showToast("Kanun notu kaydedildi.");
      };

      const deleteLawNote = (code, id) => {
        saveLawNotes({ ...lawNotes, [code]: (lawNotes[code] || []).filter((n) => n.id !== id) });
        showToast("Not silindi.");
      };

      const topics = useMemo(() => {
        const set = new Set(cards.map((c) => c.topic));
        return Array.from(set);
      }, [cards]);

      const topicStats = useMemo(() => {
        return topics.map((t) => {
          const tc = cards.filter((c) => c.topic === t);
          const avg = tc.length ? tc.reduce((s, c) => s + c.level, 0) / (tc.length * 4) : 0;
          return { topic: t, count: tc.length, mastery: Math.round(avg * 100) };
        });
      }, [cards, topics]);

      useEffect(() => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        const sorted = [...pool].sort((a, b) => a.level - b.level || (a.lastReviewed || "").localeCompare(b.lastReviewed || ""));
        setQueueIds(sorted.map((c) => c.id));
        setCursor(0);
        setFlipped(false);
      }, [selectedTopic, tab, cards]);

      const queue = queueIds.map((id) => cards.find((c) => c.id === id)).filter(Boolean);
      const current = queue[cursor % Math.max(queue.length, 1)];

      const rate = (delta) => {
        if (!current) return;
        const next = cards.map((c) =>
          c.id === current.id
            ? { ...c, level: Math.max(0, Math.min(4, c.level + delta)), lastReviewed: new Date().toISOString() }
            : c
        );
        saveCards(next);
        setFlipped(false);
        setCursor((c) => c + 1);
      };

      const deleteCard = (id) => {
        saveCards(cards.filter((c) => c.id !== id));
        showToast("Fiş silindi.");
      };

      const startQuiz = () => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        if (pool.length < 2) {
          showToast("Deneme başlatmak için en az 2 fiş gerekli.");
          return;
        }
        const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
        const questions = shuffled.map((c) => {
          const distractorPool = cards.filter((o) => o.id !== c.id && o.back !== c.back);
          const distractors = distractorPool.sort(() => Math.random() - 0.5).slice(0, 3).map((o) => o.back);
          const options = [...distractors, c.back].sort(() => Math.random() - 0.5);
          return { cardId: c.id, front: c.front, correct: c.back, options };
        });
        setQuiz({ questions, i: 0, score: 0, answered: false, picked: null, finished: false });
        setQuizMode(true);
      };

      const answerQuiz = (opt) => {
        if (!quiz || quiz.answered) return;
        const isCorrect = opt === quiz.questions[quiz.i].correct;
        setQuiz({ ...quiz, answered: true, picked: opt, score: quiz.score + (isCorrect ? 1 : 0) });
      };

      const nextQuizQuestion = () => {
        if (!quiz) return;
        if (quiz.i + 1 >= quiz.questions.length) {
          setQuiz({ ...quiz, finished: true });
        } else {
          setQuiz({ ...quiz, i: quiz.i + 1, answered: false, picked: null });
        }
      };

      const exitQuiz = () => {
        setQuiz(null);
        setQuizMode(false);
      };

      const addCard = () => {
        if (!form.topic.trim() || !form.front.trim() || !form.back.trim()) {
          showToast("Tüm alanları doldurmalısın.");
          return;
        }
        const newCard = {
          id: uid(),
          topic: form.topic.trim(),
          front: form.front.trim(),
          back: form.back.trim(),
          level: 0,
          lastReviewed: null,
        };
        saveCards([...cards, newCard]);
        setForm({ topic: form.topic, front: "", back: "" });
        showToast("Yeni fiş eklendi!");
      };

      const goBackToCourses = () => {
        setSelectedCourse(null);
        setShowResourceForm(false);
        setExpandedResourceId(null);
      };

      if (loading) return null;

      const COLORS = {
        ink: "#1C2B4A",
        parchment: "#F6F1E4",
        bordo: "#7C2D3B",
        gold: "#B8923F",
        charcoal: "#2A2622",
        green: "#4C6B4F",
        rust: "#A6432F",
        line: "#D9CFB8",
      };

      return (
        <div style={{ minHeight: "100vh", background: COLORS.parchment, fontFamily: "'IBM Plex Sans', sans-serif", color: COLORS.charcoal, paddingBottom: 90 }}>
          <style>{`
            * { box-sizing: border-box; }
            .fiş-front, .fiş-back {
              backface-visibility: hidden;
              position: absolute;
              inset: 0;
              border-radius: 6px;
              display: flex;
              flex-direction: column;
              justify-content: center;
              padding: 24px 20px;
            }
            .fiş-back { transform: rotateY(180deg); }
            .fiş-inner {
              position: relative;
              width: 100%;
              height: 100%;
              transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
              transform-style: preserve-3d;
            }
            .fiş-inner.flipped { transform: rotateY(180deg); }
            button { font-family: inherit; cursor: pointer; }
            input, textarea { font-family: inherit; }
            ::-webkit-scrollbar { display: none; }
          `}</style>

          {/* Header */}
          <div style={{ padding: "20px 20px 14px", borderBottom: `1px solid ${COLORS.line}`, background: COLORS.parchment }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 700, color: COLORS.ink, letterSpacing: -0.3 }}>
                  Muzo Hukuk
                </div>
                <div style={{ fontSize: 12, color: COLORS.bordo, marginTop: 2, fontWeight: 500 }}>
                  3. Sınıf ders kaynakları &amp; sınav pratikleri
                </div>
              </div>
              <button onClick={() => setShowSettings(true)} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 8, width: 36, height: 36, fontSize: 16, flexShrink: 0 }}>
                ⚙️
              </button>
            </div>

            {/* Sınav Geri Sayımı & Günlük Hedef Widget'ı */}

                    </div>
                  )}

                  <button onClick={() => deleteCard(current.id)} style={{ display: "block", margin: "20px auto 0", background: "none", border: "none", fontSize: 12, color: COLORS.bordo, opacity: 0.55 }}>
                    Bu fişi sil
                  </button>
                </>
              )}
            </div>
          )}

          {/* ---- KARIŞIK DENEME MODU ---- */}
          {tab === "cards" && quizMode && quiz && (
            <div style={{ padding: "18px 20px" }}>
              {!quiz.finished ? (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                    <button onClick={exitQuiz} style={{ background: "none", border: "none", color: COLORS.bordo, fontSize: 13, fontWeight: 600, padding: 0 }}>← Çık</button>
                    <div style={{ fontSize: 11.5, color: COLORS.bordo, fontWeight: 600 }}>SORU {quiz.i + 1}/{quiz.questions.length}</div>
                  </div>
                  <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "20px 18px", marginBottom: 14 }}>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 600, color: COLORS.ink, lineHeight: 1.4 }}>{quiz.questions[quiz.i].front}</div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {quiz.questions[quiz.i].options.map((opt, idx) => {
                      const isCorrectOpt = opt === quiz.questions[quiz.i].correct;
                      const isPicked = opt === quiz.picked;
                      let bg = "#fff", border = COLORS.line, color = COLORS.charcoal;
                      if (quiz.answered && isCorrectOpt) { bg = "#E9EFE9"; border = COLORS.green; color = COLORS.green; }
                      else if (quiz.answered && isPicked) { bg = "#F3E3D9"; border = COLORS.rust; color = COLORS.rust; }
                      return (
                        <button key={idx} onClick={() => answerQuiz(opt)} disabled={quiz.answered}
                          style={{ textAlign: "left", padding: "13px 15px", borderRadius: 6, border: `1px solid ${border}`, background: bg, color, fontSize: 13.5, lineHeight: 1.4 }}>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                  {quiz.answered && (
                    <button onClick={nextQuizQuestion} style={{ marginTop: 16, width: "100%", padding: "13px 0", borderRadius: 6, border: "none", background: COLORS.ink, color: "#fff", fontWeight: 600, fontSize: 14 }}>
                      {quiz.i + 1 >= quiz.questions.length ? "Sonucu Gör" : "Sonraki Soru"}
                    </button>
                  )}
                </>
              ) : (
                <div style={{ textAlign: "center", padding: "40px 10px" }}>
                  <div style={{ fontFamily: "'Fraunces', serif", fontSize: 40, fontWeight: 700, color: COLORS.bordo }}>{quiz.score}/{quiz.questions.length}</div>
                  <div style={{ fontSize: 13, color: COLORS.charcoal, opacity: 0.75, marginTop: 4, marginBottom: 20 }}>
                    {selectedTopic === "Tümü" ? "Tüm konular" : selectedTopic}
                  </div>
                  <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                    <button onClick={startQuiz} style={{ padding: "12px 20px", borderRadius: 6, border: `1px solid ${COLORS.line}`, background: "#fff", color: COLORS.ink, fontWeight: 600, fontSize: 13.5 }}>Tekrar Dene</button>
                    <button onClick={exitQuiz} style={{ padding: "12px 20px", borderRadius: 6, border: "none", background: COLORS.ink, color: "#fff", fontWeight: 600, fontSize: 13.5 }}>Fişlere Dön</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ---- PRATİK / OLAY ÇÖZME TAB ---- */}
          {tab === "pratik" && (
            <div style={{ padding: "18px 20px" }}>
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: COLORS.ink, marginBottom: 4 }}>Olay Çözüm Pratikleri</div>
              <div style={{ fontSize: 12, color: COLORS.bordo, opacity: 0.8, marginBottom: 14 }}>
                Sınavlara hazırlık için pratik olay metinleri ve adım adım hukuki çözümler.
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 14 }}>
                {cases.map((c) => {
                  const isOpen = openCaseId === c.id;
                  return (
                    <div key={c.id} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: 16 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.bordo, letterSpacing: 0.5 }}>
                          {c.course.toUpperCase()}
                        </div>
                        <button onClick={() => deleteCase(c.id)} style={{ background: "none", border: "none", fontSize: 11, color: COLORS.bordo, opacity: 0.5, padding: 0 }}>sil</button>
                      </div>
                      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>
                        {c.title}
                      </div>
                      <div style={{ fontSize: 13, color: COLORS.charcoal, lineHeight: 1.45, marginBottom: 10, background: COLORS.parchment, padding: 10, borderRadius: 4 }}>
                        <strong>Olay:</strong> {c.factPattern}
                      </div>
                      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.rust, marginBottom: 10 }}>
                        ❓ Hukuki Sorun: {c.legalIssue}
                      </div>

                      {isOpen ? (
                        <div style={{ borderTop: `1px solid ${COLORS.line}`, paddingTop: 10, marginTop: 10 }}>
                          {c.statute && (
                            <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.green, marginBottom: 4 }}>
                              İlgili Mevzuat: {c.statute}
                            </div>
                          )}
                          <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>
                            <strong>Çözüm &amp; Gerekçe:</strong> {c.solution}
                          </div>
                          <button onClick={() => setOpenCaseId(null)} style={{ background: "none", border: "none", color: COLORS.bordo, fontSize: 12, fontWeight: 600, marginTop: 10, padding: 0 }}>
                            ▲ Çözümü Gizle
                          </button>
                        </div>
                      ) : (
                        <button onClick={() => setOpenCaseId(c.id)} style={{ width: "100%", padding: "9px 0", borderRadius: 5, border: `1px solid ${COLORS.line}`, background: COLORS.parchment, color: COLORS.ink, fontWeight: 600, fontSize: 12.5 }}>
                          ▼ Çözümü ve Gerekçeyi Gör
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>

              {!showCaseForm ? (
                <button onClick={() => setShowCaseForm(true)} style={{ width: "100%", padding: "13px 0", borderRadius: 6, border: `1px dashed ${COLORS.bordo}`, background: "transparent", color: COLORS.bordo, fontWeight: 600, fontSize: 13.5 }}>
                  + Yeni Olay Ekle
                </button>
              ) : (
                <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: 16 }}>
                  <div style={{ fontWeight: 600, fontSize: 13.5, color: COLORS.ink, marginBottom: 10 }}>Yeni Olay</div>
                  <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 8, paddingBottom: 2 }}>
                    {COURSES.map((c) => (
                      <button key={c} onClick={() => setCaseForm({ ...caseForm, course: c })} style={{
                        flexShrink: 0, padding: "6px 12px", borderRadius: 999, fontSize: 11.5, fontWeight: 600,
                        border: `1px solid ${caseForm.course === c ? COLORS.bordo : COLORS.line}`,
                        background: caseForm.course === c ? COLORS.bordo : "transparent",
                        color: caseForm.course === c ? "#fff" : COLORS.charcoal,
                      }}>{c}</button>
                    ))}
                  </div>
                  <input placeholder="Başlık" value={caseForm.title} onChange={(e) => setCaseForm({ ...caseForm, title: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                  <textarea placeholder="Olay metni" value={caseForm.factPattern} onChange={(e) => setCaseForm({ ...caseForm, factPattern: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5, minHeight: 60, resize: "vertical" }} />
                  <input placeholder="Hukuki sorun (soru cümlesi)" value={caseForm.legalIssue} onChange={(e) => setCaseForm({ ...caseForm, legalIssue: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                  <input placeholder="İlgili mevzuat (örn. TMK m. 683) — opsiyonel" value={caseForm.statute} onChange={(e) => setCaseForm({ ...caseForm, statute: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                  <textarea placeholder="Çözüm ve gerekçe" value={caseForm.solution} onChange={(e) => setCaseForm({ ...caseForm, solution: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 12, fontSize: 13.5, minHeight: 60, resize: "vertical" }} />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={addCase} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: "none", background: COLORS.ink, color: "#fff", fontWeight: 600, fontSize: 13.5 }}>Kaydet</button>
                    <button onClick={() => setShowCaseForm(false)} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.charcoal, fontSize: 13.5 }}>Kapat</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ---- TOPICS TAB ---- */}
          {tab === "topics" && (
            <div style={{ padding: "18px 20px" }}>
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: COLORS.ink, marginBottom: 14 }}>Konularım</div>

              {/* Çalışma Serisi */}
              <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "14px 16px", marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                  <div style={{ fontSize: 26 }}>🔥</div>
                  <div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 700, color: COLORS.ink }}>{currentStreak} gün</div>
                    <div style={{ fontSize: 11, color: COLORS.bordo, fontWeight: 500 }}>üst üste çalışma serisi</div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 5, alignItems: "flex-end", height: 44 }}>
                  {last7Days.map((d, i) => (
                    <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                      <div style={{
                        width: "100%", borderRadius: 3,
                        height: Math.max(4, Math.min(30, d.count * 4)),
                        background: d.count > 0 ? (d.isToday ? COLORS.bordo : COLORS.gold) : COLORS.line,
                      }} />
                      <div style={{ fontSize: 9, color: d.isToday ? COLORS.bordo : COLORS.charcoal, opacity: d.isToday ? 1 : 0.55, fontWeight: d.isToday ? 700 : 500 }}>{d.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Haftalık Program */}
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: COLORS.bordo, marginBottom: 8 }}>🗓️ HAFTALIK PROGRAM</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 22 }}>
                {WEEKDAY_ORDER.map((day) => {
                  const isToday = day === todayWeekdayName;
                  const assigned = weeklyPlan[day] || [];
                  const open = expandedDay === day;
                  return (
                    <div key={day} style={{ background: "#fff", border: `1px solid ${isToday ? COLORS.bordo : COLORS.line}`, borderRadius: 6, overflow: "hidden" }}>
                      <button onClick={() => setExpandedDay(open ? null : day)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: "none", border: "none" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ fontSize: 12.5, fontWeight: 600, color: isToday ? COLORS.bordo : COLORS.ink }}>{day}</span>
                          {isToday && <span style={{ fontSize: 8.5, fontWeight: 700, color: "#fff", background: COLORS.bordo, borderRadius: 999, padding: "2px 6px" }}>BUGÜN</span>}
                        </div>
                        <span style={{ fontSize: 10.5, color: COLORS.bordo, maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {assigned.length > 0 ? assigned.join(", ") : "boş"}
                        </span>
                      </button>
                      {open && (
                        <div style={{ padding: "0 14px 12px", display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {COURSES.map((c) => (
                            <button key={c} onClick={() => toggleDayCourse(day, c)} style={{
                              padding: "5px 10px", borderRadius: 999, fontSize: 11, fontWeight: 600,
                              border: `1px solid ${assigned.includes(c) ? COLORS.bordo : COLORS.line}`,
                              background: assigned.includes(c) ? COLORS.bordo : "transparent",
                              color: assigned.includes(c) ? "#fff" : COLORS.charcoal,
                            }}>{c}</button>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: COLORS.bordo, marginBottom: 8 }}>DERS HAKİMİYETİ</div>
              {topicStats.length === 0 && <div style={{ fontSize: 13, color: COLORS.bordo, opacity: 0.7, marginBottom: 20 }}>Henüz konu yok. Aşağıdan ilk fişini ekleyebilirsin.</div>}
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 22 }}>
                {topicStats.map((t) => (
                  <div key={t.topic} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "14px 16px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                      <div style={{ fontWeight: 600, fontSize: 14, color: COLORS.ink }}>{t.topic}</div>
                      <div style={{ fontSize: 12, color: COLORS.bordo }}>{t.count} fiş</div>
                    </div>
                    <div style={{ height: 6, background: "#EEE7D3", borderRadius: 999, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${t.mastery}%`, background: t.mastery > 66 ? COLORS.green : t.mastery > 33 ? COLORS.gold : COLORS.rust, borderRadius: 999 }} />
                    </div>
                    <div style={{ fontSize: 11, color: COLORS.charcoal, opacity: 0.6, marginTop: 6 }}>
                      Hakimiyet %{t.mastery}
                    </div>
                  </div>
                ))}
              </div>

              {!showAddForm ? (
                <button onClick={() => setShowAddForm(true)} style={{ width: "100%", padding: "13px 0", borderRadius: 6, border: `1px dashed ${COLORS.bordo}`, background: "transparent", color: COLORS.bordo, fontWeight: 600, fontSize: 13.5 }}>
                  + Yeni fiş ekle
                </button>
              ) : (
                <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: 16 }}>
                  <div style={{ fontWeight: 600, fontSize: 13.5, color: COLORS.ink, marginBottom: 10 }}>Yeni Fiş</div>
                  <input list="course-suggestions" placeholder="Konu / Ders (örn. Eşya Hukuku)" value={form.topic} onChange={(e) => setForm({ ...form, topic: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5 }} />
                  <datalist id="course-suggestions">
                    {COURSES.map((c) => <option key={c} value={c} />)}
                  </datalist>
                  <textarea placeholder="Ön yüz — Soru veya terim" value={form.front} onChange={(e) => setForm({ ...form, front: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 8, fontSize: 13.5, minHeight: 60, resize: "vertical" }} />
                  <textarea placeholder="Arka yüz — Yanıt veya açıklama" value={form.back} onChange={(e) => setForm({ ...form, back: e.target.value })} style={{ width: "100%", padding: "10px 12px", borderRadius: 5, border: `1px solid ${COLORS.line}`, marginBottom: 12, fontSize: 13.5, minHeight: 70, resize: "vertical" }} />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={addCard} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: "none", background: COLORS.ink, color: "#fff", fontWeight: 600, fontSize: 13.5 }}>Kaydet</button>
                    <button onClick={() => setShowAddForm(false)} style={{ flex: 1, padding: "11px 0", borderRadius: 5, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.charcoal, fontSize: 13.5 }}>Kapat</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Bottom Navigation */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: `1px solid ${COLORS.line}`, display: "flex", padding: "10px 0 calc(10px + env(safe-area-inset-bottom))", zIndex: 100 }}>
            {[
              ["dersler", "Dersler"],
              ["kanunlar", "Kanunlar"],
              ["cards", "Kartlar"],
              ["pratik", "Pratik"],
              ["topics", "Konular"],
            ].map(([key, label]) => (
              <button key={key} onClick={() => { setTab(key); if (key !== "dersler") { setSelectedCourse(null); } if (key !== "cards") { setQuizMode(false); setQuiz(null); } }} style={{ flex: 1, background: "none", border: "none", fontSize: 11.5, fontWeight: 600, color: tab === key ? COLORS.bordo : "#9A9382", padding: "4px 0" }}>
                {label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HukukFisleri />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
