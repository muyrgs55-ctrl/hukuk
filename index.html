  <script>
    // Service worker — sadece https veya localhost'ta calisir (file:// veya content:// destekli degil)
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // Turkce'ye duyarli buyuk/kucuk harf. Duz toLowerCase() "İ" harfini "i̇" (noktali i)
    // yaptigi icin "İyiniyet" ararken "iyiniyet" eslesmiyordu.
    const trLower = (s) => String(s == null ? "" : s).toLocaleLowerCase("tr");
    const trUpper = (s) => String(s == null ? "" : s).toLocaleUpperCase("tr");
    // Madde atiflarini ("İYUK 27" / "iyuk 27") ayni sepete koymak icin ASCII'ye indirger.
    const foldRef = (s) => String(s == null ? "" : s).toUpperCase()
      .replace(/İ/g, "I").replace(/Ş/g, "S").replace(/Ğ/g, "G").replace(/Ü/g, "U").replace(/Ö/g, "O").replace(/Ç/g, "C");

    // Safe Storage Adapter (localStorage)
    const storageAdapter = {
      async get(key) {
        try {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      },
    };

    const COURSES = [
      "Vergi Hukuku", "Ceza Hukuku (Özel Hükümler)", "Borçlar Hukuku (Özel Hükümler)",
      "Medeni Usul Hukuku", "Ticaret Hukuku", "İdari Yargılama Hukuku", "Eşya Hukuku",
    ];

    const WEEKDAY_ORDER = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const WEEKDAY_BY_INDEX = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    const LAWS = [
      { code: "TMK", title: "Türk Medeni Kanunu", note: "4721 sayılı — kişiler, aile, miras ve eşya hukuku (1030 madde)", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=4721&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TBK", title: "Türk Borçlar Kanunu", note: "6098 sayılı — borç ilişkileri, sözleşmeler, haksız fiil", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6098&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TCK", title: "Türk Ceza Kanunu", note: "5237 sayılı — suçlar, cezalar ve güvenlik tedbirleri", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=5237&MevzuatTur=1&MevzuatTertip=5" },
      { code: "HMK", title: "Hukuk Muhakemeleri Kanunu", note: "6100 sayılı — medeni usul, görev-yetki, deliller, kanun yolları", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6100&MevzuatTur=1&MevzuatTertip=5" },
      { code: "TTK", title: "Türk Ticaret Kanunu", note: "6102 sayılı — ticari işletme, şirketler, kıymetli evrak", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=6102&MevzuatTur=1&MevzuatTertip=5" },
      { code: "İYUK", title: "İdari Yargılama Usulü Kanunu", note: "2577 sayılı — iptal ve tam yargı davaları, süreler", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=2577&MevzuatTur=1&MevzuatTertip=5" },
      { code: "VUK", title: "Vergi Usul Kanunu", note: "213 sayılı — vergilendirme süreci, tarh, tebliğ, ceza", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=213&MevzuatTur=1&MevzuatTertip=5" },
      { code: "İİK", title: "İcra ve İflas Kanunu", note: "2004 sayılı — takip hukuku, haciz, iflas, konkordato", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=2004&MevzuatTur=1&MevzuatTertip=3" },
      { code: "KMK", title: "Kat Mülkiyeti Kanunu", note: "634 sayılı — kat mülkiyeti, ortak yerler, yönetim planı", url: "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=634&MevzuatTur=1&MevzuatTertip=5" },
    ];

    const SEED_CARDS = [
      { id: uid(), topic: "Eşya Hukuku", front: "Zilyetlik türleri nelerdir ve dolaysız zilyetlik ne anlama gelir?", back: "Zilyetlik; asli-fer'i, dolaylı-dolaysız ve tek başına-birlikte zilyetlik olarak ayrılır. Fiili hakimiyeti doğrudan doğruya kullanan kişi dolaysız zilyettir (örneğin kiracı).", level: 0, lastReviewed: null },
      { id: uid(), topic: "Borçlar Hukuku (Özel Hükümler)", front: "Satış sözleşmesinde satıcının ayıptan sorumluluğunun şartları nelerdir?", back: "1. Malın ayıplı olması, 2. Ayıbın hasarın geçtiği anda var olması, 3. Alıcının ayıbı bilmemesi, 4. Alıcının muayene ve ihbar külfetini yerine getirmiş olması.", level: 0, lastReviewed: null },
    ];

    const SEED_CASES = [
      { id: uid(), course: "Eşya Hukuku", title: "Tapuda Çift Kayıt ve İyiniyetli Üçüncü Kişi", factPattern: "(A), adına tapuda kayıtlı taşınmazı (B)'ye satmış fakat tescil yapılmamıştır. Yolsuz tescilden yararlanan (C) ise taşınmazı iyi niyetle (D)'ye devretmiştir.", legalIssue: "(D)'nin iktisabı TMK m. 1023 kapsamında korunur mu?", statute: "TMK m. 1023, TMK m. 1024", solution: "TMK m. 1023 uyarınca tapu kütüğündeki tescile iyiniyetle dayanarak ayni hak kazanan üçüncü kişinin bu kazanımı korunur. (D) iyiniyetli olduğu için mülkiyeti kazanır." },
    ];

    const SEED_DICTIONARY = [
      { id: uid(), term: "Müteselsil Sorumluluk", definition: "Birden fazla borçlunun, borcun tamamından zincirleme olarak sorumlu olması durumu." },
      { id: uid(), term: "Zilyetlik", definition: "Bir eşya üzerinde fiili hakimiyet kurma durumu." },
      { id: uid(), term: "İlliyet Bağı", definition: "Neden-sonuç ilişkisi. Haksız fiillerde zarar ile fiil arasındaki bağ." },
    ];

    // Yerel saat dilimine gore gun anahtari (UTC degil!).
    // Gece 00:00-03:00 arasi calisilan fislerin onceki gune yazilmasini engeller.
    const localDateStr = (d = new Date()) => {
      const x = new Date(d);
      return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
    };
    const localDayOf = (iso) => { try { return localDateStr(new Date(iso)); } catch (e) { return ""; } };

    const getDaysLeft = (targetDateStr) => {
      const now = new Date(); const target = new Date(targetDateStr);
      now.setHours(0, 0, 0, 0); target.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    };

    const getDriveEmbedUrl = (url) => {
      if (!url || !url.includes("drive.google.com")) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) return null;
      return `https://drive.google.com/file/d/${match[1]}/preview`;
    };

    const NOTE_COLORS = [
      { key: "none", label: "Etiketsiz", color: "#D9CFB8" },
      { key: "onemli", label: "Önemli", color: "#B8923F" },
      { key: "sinav", label: "Sınavda çıkar", color: "#7C2D3B" },
      { key: "karistiriyorum", label: "Karıştırıyorum", color: "#A6432F" },
      { key: "ogrendim", label: "Öğrendim", color: "#4C6B4F" },
    ];
    const getNoteColor = (key) => (NOTE_COLORS.find((c) => c.key === key) || NOTE_COLORS[0]).color;
    
    const COURTS = ["Yargıtay", "Danıştay", "Anayasa Mahkemesi", "BAM", "Diğer"];
    const CODE_ALIASES = { TMK: "TMK", MK: "TMK", TBK: "TBK", BK: "TBK", TCK: "TCK", CK: "TCK", HMK: "HMK", IYUK: "İYUK", KMK: "KMK", TTK: "TTK", VUK: "VUK", IIK: "İİK" };
    
    const parseArticleRefs = (text, defaultCode) => {
      if (!text) return [];
      const found = new Set();
      const up = String(text).toUpperCase().replace(/İ/g, "I").replace(/Ş/g, "S").replace(/Ğ/g, "G").replace(/Ü/g, "U").replace(/Ö/g, "O").replace(/Ç/g, "C");
      const withCode = /\b(TMK|TBK|TCK|HMK|IYUK|KMK|TTK|VUK|IIK|MK|BK|CK)\b[\s.]*(?:MADDE|M)?[\s.]*(\d{1,4})/g;
      let m;
      while ((m = withCode.exec(up)) !== null) { found.add((CODE_ALIASES[m[1]] || m[1]) + " " + m[2]); }
      if (defaultCode) {
        const noCode = /(?:^|[^A-Z0-9])(?:MADDE|M)[\s.]+(\d{1,4})/g;
        while ((m = noCode.exec(up)) !== null) { found.add(defaultCode + " " + m[1]); }
      }
      return Array.from(found);
    };

    const sortArticleRefs = (a, b) => {
      const [ca, na] = a.split(" "); const [cb, nb] = b.split(" ");
      if (ca !== cb) return ca.localeCompare(cb, "tr");
      return parseInt(na, 10) - parseInt(nb, 10);
    };

    const WORK_MSGS = [
      "Süre doldu! Harika bir odaklanmaydı, şimdi kısa bir dinlenme vakti.",
      "Zaman bitti! Bir bardak su iç ve gözlerini ekrandan/kitaptan ayır.",
      "Hedefine bir adım daha yaklaştın. Şimdi derin bir nefes al ve mola ver!"
    ];
    const BREAK_MSGS = [
      "Mola bitti! Hayallerin ve hedeflerin için tekrar masaya dönme vakti.",
      "Dinlenme süren doldu. Hadi o konuyu bitirelim, odaklan!",
      "Kitaplar seni bekliyor, geleceğin için çalışmaya devam!"
    ];

    function HukukFisleri() {
      const [lastBackup, setLastBackup] = useState(null);
      const [loading, setLoading] = useState(true);

      const [cards, setCards] = useState([]);
      const [resources, setResources] = useState({});
      const [cases, setCases] = useState([]);
      const [lawNotes, setLawNotes] = useState({});
      const [precedents, setPrecedents] = useState([]);
      const [dictionary, setDictionary] = useState([]);
      
      const [tab, setTab] = useState("dersler");
      const [lawSubTab, setLawSubTab] = useState("kanunlar");
      const [pratikSubTab, setPratikSubTab] = useState("olaylar");
      const [selectedCourse, setSelectedCourse] = useState(null);
      
      const [showResourceForm, setShowResourceForm] = useState(false);
      const [resourceForm, setResourceForm] = useState({ title: "", url: "", note: "", category: "Genel" });
      const [editingResourceId, setEditingResourceId] = useState(null);
      const [expandedResourceId, setExpandedResourceId] = useState(null);
      
      const [showSettings, setShowSettings] = useState(false);
      const [showGlobalSearch, setShowGlobalSearch] = useState(false);
      const [globalQuery, setGlobalQuery] = useState("");
      const [showFocusMode, setShowFocusMode] = useState(false);
      const [audioMode, setAudioMode] = useState(false);
      const [darkMode, setDarkModeState] = useState(false);
      
      const [grades, setGrades] = useState({});
      const [examDates, setExamDates] = useState({ vize: "", final: "" });
      const [selectedTopic, setSelectedTopic] = useState("Tümü");
      const [queueIds, setQueueIds] = useState([]);
      const [cursor, setCursor] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [quizMode, setQuizMode] = useState(false);
      const [quiz, setQuiz] = useState(null);
      const [weeklyPlan, setWeeklyPlan] = useState({});
      const [expandedDay, setExpandedDay] = useState(null);
      const [lawSearch, setLawSearch] = useState("");
      const [expandedLaw, setExpandedLaw] = useState(null);
      const [noteDraft, setNoteDraft] = useState({ madde: "", text: "", color: "none", review: false });
      const [editingNoteId, setEditingNoteId] = useState(null);
      const [onlyFlaggedNotes, setOnlyFlaggedNotes] = useState(false);
      const [articleSearch, setArticleSearch] = useState("");
      const [selectedArticle, setSelectedArticle] = useState(null);
      
      const [showAddForm, setShowAddForm] = useState(false);
      const [printCourse, setPrintCourse] = useState(null);
      const [shareIntake, setShareIntake] = useState(null);
      
      const [form, setForm] = useState({ topic: "", front: "", back: "", statute: "" });
      const [editingCardId, setEditingCardId] = useState(null);
      
      const [openCaseId, setOpenCaseId] = useState(null);
      const [showCaseForm, setShowCaseForm] = useState(false);
      const [caseForm, setCaseForm] = useState({ course: COURSES[0], title: "", factPattern: "", legalIssue: "", statute: "", solution: "" });
      const [editingCaseId, setEditingCaseId] = useState(null);
      
      const [openPrecedentId, setOpenPrecedentId] = useState(null);
      const [showPrecedentForm, setShowPrecedentForm] = useState(false);
      const [precedentForm, setPrecedentForm] = useState({ court: COURTS[0], caseNo: "", date: "", topic: "", statute: "", summary: "" });
      const [editingPrecedentId, setEditingPrecedentId] = useState(null);
      const [precedentSearch, setPrecedentSearch] = useState("");
      const [toast, setToast] = useState(null);
      
      const [showDictForm, setShowDictForm] = useState(false);
      const [dictForm, setDictForm] = useState({ term: "", definition: "" });
      const [editingDictId, setEditingDictId] = useState(null);
      const [dictSearch, setDictSearch] = useState("");
      
      // Pomodoro States — zaman damgasi tabanli (arka planda da dogru sayar)
      const [pomoSettings, setPomoSettings] = useState({ work: 25, break: 5 });
      const [pomoSettingsDraft, setPomoSettingsDraft] = useState({ work: 25, break: 5 });
      const [pomoRemaining, setPomoRemaining] = useState(25 * 60);
      const [pomoIsRunning, setPomoIsRunning] = useState(false);
      const [pomoMode, setPomoMode] = useState("work");
      const pomoEndsAtRef = useRef(null);
      const pomoFiredRef = useRef(false);
      const [notificationGranted, setNotificationGranted] = useState(false);
      const ttsWarnedRef = useRef(false);
      const touchStartRef = useRef(null);
      const swipedRef = useRef(false);
      const pendingCardRef = useRef(null);
      const [sessionRated, setSessionRated] = useState(0);

      const currentYear = new Date().getFullYear();
      const defaultVizeDateStr = `${currentYear}-12-28`;
      const defaultFinalDateStr = `${new Date().getMonth() >= 6 ? currentYear + 1 : currentYear}-06-01`;
      const vizeDateStr = examDates.vize || defaultVizeDateStr;
      const finalDateStr = examDates.final || defaultFinalDateStr;
      const vizeDays = useMemo(() => getDaysLeft(vizeDateStr), [vizeDateStr]);
      const finalDays = useMemo(() => getDaysLeft(finalDateStr), [finalDateStr]);
      
      const formatDateLabel = (dateStr) => {
        try { return new Date(dateStr + "T00:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" }); }
        catch (e) { return dateStr; }
      };

      const dailyTarget = 10;
      const todayReviewedCount = useMemo(() => {
        const todayStr = localDateStr();
        return cards.filter(c => c.lastReviewed && localDayOf(c.lastReviewed) === todayStr).length;
      }, [cards]);
      
      const studyDaysSet = useMemo(() => {
        const set = new Set();
        cards.forEach((c) => { if (c.lastReviewed) set.add(localDayOf(c.lastReviewed)); });
        return set;
      }, [cards]);
      
      const currentStreak = useMemo(() => {
        let streak = 0; let d = new Date();
        if (!studyDaysSet.has(localDateStr(d))) d.setDate(d.getDate() - 1);
        while (studyDaysSet.has(localDateStr(d))) {
          streak++; d.setDate(d.getDate() - 1);
        }
        return streak;
      }, [studyDaysSet]);
      
      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const dStr = localDateStr(d);
          const count = cards.filter((c) => c.lastReviewed && localDayOf(c.lastReviewed) === dStr).length;
          days.push({ label: d.toLocaleDateString("tr-TR", { weekday: "short" }), count, isToday: i === 0 });
        }
        return days;
      }, [cards]);

      const todayWeekdayName = WEEKDAY_BY_INDEX[new Date().getDay()];
      // Ust uste gelen bildirimlerde onceki zamanlayici yenisini erken kapatiyordu.
      const toastTimerRef = useRef(null);
      const showToast = (msg) => {
        setToast(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => { setToast(null); toastTimerRef.current = null; }, 3500);
      };
      useEffect(() => () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);

      useEffect(() => {
        if ("Notification" in window) setNotificationGranted(Notification.permission === "granted");
      }, []);

      // Karanlik modda body zemini ve tarayici tema rengi de degissin.
      useEffect(() => {
        const bg = darkMode ? "#12161F" : "#F6F1E4";
        document.body.style.backgroundColor = bg;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", darkMode ? "#12161F" : "#1C2B4A");
      }, [darkMode]);

      const requestNotificationPermission = () => {
        if (!("Notification" in window)) { showToast("Tarayıcınız bildirimleri desteklemiyor."); return; }
        if (!window.isSecureContext) {
          showToast("Bildirimler yalnızca https adresinde çalışır. Sayaç ekranı açıkken sesli uyarı yine çalışır.");
          return;
        }
        if (Notification.permission === "denied") {
          showToast("Bildirimler daha önce reddedilmiş. Tarayıcı site ayarlarından açman gerekiyor.");
          return;
        }
        Notification.requestPermission().then(permission => {
          if (permission === "granted") { setNotificationGranted(true); showToast("Harika! Artık bildirim alacaksın."); }
          else { showToast("Bildirim izni verilmedi."); }
        }).catch(() => showToast("Bildirim izni alınamadı."));
      };

      // Android Chrome ve PWABuilder APK'sinda "new Notification()" yasak (Illegal constructor).
      // Once service worker uzerinden dene, olmazsa klasik yola dus.
      const sendPomoNotification = (title, body) => {
        try {
          if (!("Notification" in window) || Notification.permission !== "granted") return;
          const opts = { body, icon: "icon-192.png", badge: "icon-192.png", tag: "muzo-pomo", renotify: true };
          const legacy = () => { try { new Notification(title, opts); } catch (e) {} };
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready
              .then((reg) => reg.showNotification(title, opts))
              .catch(legacy);
            return;
          }
          legacy();
        } catch (e) { /* sessizce gec */ }
      };

      useEffect(() => {
        (async () => {
          // Ornek veriler SADECE ilk kurulumda yuklenir. "seeded" bayragi olmadan
          // "Tum Verileri Sil" sonrasi ornek fisler/olay/terimler geri geliyordu.
          let firstRun = true;
          try { const sd = await storageAdapter.get("seeded"); if (sd && sd.value) firstRun = false; } catch (e) {}

          let loadedCards = firstRun ? SEED_CARDS : []; let loadedResources = {}; let loadedCases = firstRun ? SEED_CASES : [];
          let loadedLawNotes = {}; let loadedExamDates = { vize: "", final: "" }; let loadedWeeklyPlan = {};
          let loadedPrecedents = []; let loadedDictionary = firstRun ? SEED_DICTIONARY : []; let loadedPomo = { work: 25, break: 5 };
          try { const c = await storageAdapter.get("cards"); if (c && c.value) loadedCards = JSON.parse(c.value); } catch (e) {}
          try { const r = await storageAdapter.get("resources"); if (r && r.value) loadedResources = JSON.parse(r.value); } catch (e) {}
          try { const cs = await storageAdapter.get("cases"); if (cs && cs.value) loadedCases = JSON.parse(cs.value); } catch (e) {}
          try { const ln = await storageAdapter.get("law-notes"); if (ln && ln.value) loadedLawNotes = JSON.parse(ln.value); } catch (e) {}

        return idx;
      }, [cards, cases, lawNotes, precedents]);
      
      const articleRefList = useMemo(() => {
        const q = foldRef(articleSearch.trim()).replace(/\s+/g, " ");
        return Object.keys(articleIndex).filter((ref) => {
          if (!q) return true;
          const f = foldRef(ref);
          return f.includes(q) || f.replace(" ", "").includes(q.replace(" ", ""));
        }).sort(sortArticleRefs);
      }, [articleIndex, articleSearch]);

      const topics = useMemo(() => Array.from(new Set(cards.map((c) => c.topic))), [cards]);
      const topicStats = useMemo(() => {
        return topics.map((t) => {
          const tc = cards.filter((c) => c.topic === t);
          const avg = tc.length ? tc.reduce((s, c) => s + c.level, 0) / (tc.length * 4) : 0;
          return { topic: t, count: tc.length, mastery: Math.round(avg * 100) };
        });
      }, [cards, topics]);
      const weakestTopics = useMemo(() => [...topicStats].filter((t) => t.count > 0).sort((a, b) => a.mastery - b.mastery).slice(0, 3), [topicStats]);
      
      const flaggedNotesList = useMemo(() => {
        const list = []; Object.entries(lawNotes).forEach(([code, notes]) => { (notes || []).forEach((n) => { if (n.review) list.push({ ...n, code }); }); }); return list;
      }, [lawNotes]);
      
      const todaysPlanCourses = weeklyPlan[todayWeekdayName] || [];
      
      const globalSearchResults = useMemo(() => {
        const q = trLower(globalQuery.trim()); if (!q) return null;
        const res = { cards: [], resources: [], cases: [], precedents: [], notes: [], dictionary: [] };
        cards.forEach((c) => { if (trLower([c.topic, c.front, c.back, c.statute].filter(Boolean).join(" ")).includes(q)) res.cards.push(c); });
        Object.entries(resources).forEach(([course, list]) => { (list || []).forEach((r) => { if (trLower([r.title, r.note, course].filter(Boolean).join(" ")).includes(q)) res.resources.push({ ...r, course }); }); });
        cases.forEach((c) => { if (trLower([c.title, c.factPattern, c.legalIssue, c.solution, c.statute, c.course].filter(Boolean).join(" ")).includes(q)) res.cases.push(c); });
        precedents.forEach((p) => { if (trLower([p.court, p.caseNo, p.topic, p.statute, p.summary].filter(Boolean).join(" ")).includes(q)) res.precedents.push(p); });
        Object.entries(lawNotes).forEach(([code, list]) => { (list || []).forEach((n) => { if (trLower([n.madde, n.text, code].filter(Boolean).join(" ")).includes(q)) res.notes.push({ ...n, code }); }); });
        dictionary.forEach((d) => { if (trLower([d.term, d.definition].filter(Boolean).join(" ")).includes(q)) res.dictionary.push(d); });
        return res;
      }, [globalQuery, cards, resources, cases, precedents, lawNotes, dictionary]);
      
      const globalResultCount = globalSearchResults ? Object.values(globalSearchResults).reduce((s, arr) => s + arr.length, 0) : 0;
      
      const goToCard = (card) => {
        const topic = card.topic || "Tümü";
        const sameView = tab === "cards" && selectedTopic === topic;
        if (sameView) {
          const idxNow = queueIds.indexOf(card.id);
          if (idxNow >= 0) { setCursor(idxNow); setFlipped(false); }
        } else {
          pendingCardRef.current = card.id; // kuyruk yeniden kurulunca bu fise atlanir
        }
        setTab("cards"); setQuizMode(false); setQuiz(null); setSelectedTopic(topic);
        setShowGlobalSearch(false); setShowFocusMode(false);
      };
      const goToResource = (course) => { setTab("dersler"); setSelectedCourse(course); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToCase = (c) => { setTab("pratik"); setPratikSubTab("olaylar"); setOpenCaseId(c.id); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToPrecedent = (p) => { setTab("pratik"); setPratikSubTab("ictihat"); setOpenPrecedentId(p.id); setShowGlobalSearch(false); setShowFocusMode(false); };
      const goToLawNote = (code) => { setTab("kanunlar"); setLawSubTab("kanunlar"); setExpandedLaw(code); setOnlyFlaggedNotes(false); setShowGlobalSearch(false); setShowFocusMode(false); };

      // ONEMLI: bagimlilikta "cards" yerine "cards.length" var. Aksi halde her puanlamada
      // kuyruk yeniden kurulup imlec 0'a doniyor ve sayac hep "1 / N" kaliyordu.
      useEffect(() => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        const sorted = [...pool].sort((a, b) => a.level - b.level || (a.lastReviewed || "").localeCompare(b.lastReviewed || ""));
        setQueueIds(sorted.map((c) => c.id));
        const pendingId = pendingCardRef.current; pendingCardRef.current = null;
        const idx = pendingId ? sorted.findIndex((c) => c.id === pendingId) : -1;
        setCursor(idx > 0 ? idx : 0); setFlipped(false); setSessionRated(0);
      }, [selectedTopic, tab, cards.length]);
      
      const queue = queueIds.map((id) => cards.find((c) => c.id === id)).filter(Boolean);
      const sessionDone = queue.length > 0 && cursor >= queue.length;
      const current = queue.length ? queue[Math.min(cursor, queue.length - 1)] : undefined;
      
      useEffect(() => { if (tab !== "cards" && "speechSynthesis" in window) window.speechSynthesis.cancel(); }, [tab]);
      useEffect(() => { if (!audioMode || quizMode || sessionDone || tab !== "cards" || !current) return; speak(flipped ? current.back : current.front); }, [audioMode, flipped, current && current.id, quizMode, sessionDone, tab]);
      
      const rate = (delta) => {
        if (!current || sessionDone) return;
        const next = cards.map((c) => c.id === current.id ? { ...c, level: Math.max(0, Math.min(4, (c.level || 0) + delta)), lastReviewed: new Date().toISOString() } : c);
        saveCards(next); setFlipped(false); setSessionRated((n) => n + 1); setCursor((c) => c + 1);
      };
      const restartSession = () => { setCursor(0); setFlipped(false); setSessionRated(0); };
      
      const deleteCard = (id) => { if (!confirm("Bu fişi silmek istediğine emin misin?")) return; saveCards(cards.filter((c) => c.id !== id)); showToast("Fiş silindi."); };
      
      const startQuiz = () => {
        const pool = cards.filter((c) => selectedTopic === "Tümü" || c.topic === selectedTopic);
        if (pool.length < 2) { showToast("Deneme başlatmak için en az 2 fiş gerekli."); return; }
        const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
        const questions = shuffled.map((c) => {
          // Yanlis siklar once ayni konudan secilir; yetmezse ayni dersin diger fislerinden tamamlanir
          let distractorPool = pool.filter((o) => o.id !== c.id && o.back !== c.back);
          if (distractorPool.length < 3) {
            const extra = cards.filter((o) => o.id !== c.id && o.back !== c.back && !distractorPool.some((d) => d.id === o.id));
            distractorPool = [...distractorPool, ...extra];
          }
          const distractors = distractorPool.sort(() => Math.random() - 0.5).slice(0, 3).map((o) => o.back);
          const options = [...distractors, c.back].sort(() => Math.random() - 0.5);
          return { cardId: c.id, front: c.front, correct: c.back, options };
        });
        setQuiz({ questions, i: 0, score: 0, answered: false, picked: null, finished: false }); setQuizMode(true);
      };
      const answerQuiz = (opt) => {
        if (!quiz || quiz.answered) return;
        const isCorrect = opt === quiz.questions[quiz.i].correct;
        setQuiz({ ...quiz, answered: true, picked: opt, score: quiz.score + (isCorrect ? 1 : 0) });
      };
      const nextQuizQuestion = () => {
        if (!quiz) return;
        if (quiz.i + 1 >= quiz.questions.length) { setQuiz({ ...quiz, finished: true }); } 
        else { setQuiz({ ...quiz, i: quiz.i + 1, answered: false, picked: null }); }
      };
      const exitQuiz = () => { setQuiz(null); setQuizMode(false); };

      const addCard = () => {
        if (!form.topic.trim() || !form.front.trim() || !form.back.trim()) { showToast("Tüm alanları doldurmalısın."); return; }
        if (editingCardId) {

          setEditingCardId(null); setForm({ topic: "", front: "", back: "", statute: "" }); setShowAddForm(false); showToast("Fiş güncellendi."); return;
        }
        const newCard = { id: uid(), topic: form.topic.trim(), front: form.front.trim(), back: form.back.trim(), statute: (form.statute || "").trim(), level: 0, lastReviewed: null };
        saveCards([...cards, newCard]); setForm({ topic: form.topic, front: "", back: "", statute: "" }); showToast("Yeni fiş eklendi!");

                      ⏳<span style={{position:"absolute", top:-3, right:-3, width:10, height:10, background:COLORS.rust, borderRadius:999, border:`2px solid ${COLORS.surface}`}}></span>
                    </button>

                  <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                    <div style={{ flex: 1 }}>

                      <input type="date" value={vizeDateStr} onChange={(e) => saveExamDates({ ...examDates, vize: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 5, border: `1px solid ${COLORS.line}`, fontSize: 13, background: COLORS.surface }} />
                    </div>

                      <input type="date" value={finalDateStr} onChange={(e) => saveExamDates({ ...examDates, final: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 5, border: `1px solid ${COLORS.line}`, fontSize: 13, background: COLORS.surface }} />

                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>

                          return (

                    <div
                      onTouchStart={(e) => { const t = e.touches[0]; touchStartRef.current = { x: t.clientX, y: t.clientY, at: Date.now() }; }}
                      onTouchEnd={(e) => {
                        const s = touchStartRef.current; touchStartRef.current = null;
                        if (!s) return;

                          <span style={{ fontSize: 13, fontWeight: isToday ? 700 : 600, color: isToday ? COLORS.bordo : COLORS.heading }}>{day}{isToday ? " • bugün" : ""}</span>
                          <span style={{ fontSize: 11, color: COLORS.charcoal, opacity: 0.6 }}>{items.length ? `${items.length} ders` : "boş"} {isOpen ? "▲" : "▼"}</span>
                        </button>

                        {isOpen && (
                          <div style={{ marginTop: 10, borderTop: `1px solid ${COLORS.line}`, paddingTop: 10 }}>
                            {items.map((item) => (
                              <div key={item.id} style={{ marginBottom: 9 }}>
                                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                  <input type="time" value={item.time || ""} onChange={(e) => updateScheduleItem(day, item.id, "time", e.target.value)} style={{ width: 82, padding: "7px 6px", borderRadius: 4, border: `1px solid ${COLORS.line}`, fontSize: 12, background: COLORS.parchment, color: COLORS.heading }} />
                                  <select value={item.course || COURSES[0]} onChange={(e) => updateScheduleItem(day, item.id, "course", e.target.value)} style={{ flex: 1, minWidth: 0, padding: "7px 6px", borderRadius: 4, border: `1px solid ${COLORS.line}`, fontSize: 12, background: COLORS.parchment, color: COLORS.heading }}>
                                    {COURSES.map((c) => <option key={c} value={c}>{c}</option>)}
                                    {!COURSES.includes(item.course) && item.course && <option value={item.course}>{item.course}</option>}
                                  </select>
                                  <button onClick={() => removeScheduleItem(day, item.id)} aria-label="Bu dersi programdan çıkar" style={{ background: "none", border: "none", fontSize: 15, color: COLORS.bordo, opacity: 0.5, padding: "0 2px" }}>✕</button>
                                </div>
                                <input placeholder="Derslik / amfi — opsiyonel" value={item.location || ""} onChange={(e) => updateScheduleItem(day, item.id, "location", e.target.value)} style={{ width: "100%", marginTop: 5, padding: "6px 8px", borderRadius: 4, border: `1px solid ${COLORS.line}`, fontSize: 11.5, background: COLORS.parchment, color: COLORS.heading }} />
                              </div>
                            ))}
                            <button onClick={() => addScheduleItem(day)} style={{ width: "100%", padding: "8px 0", borderRadius: 5, border: `1px dashed ${COLORS.line}`, background: "transparent", color: COLORS.bordo, fontSize: 12, fontWeight: 600, marginTop: 4 }}>+ Ders ekle</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Notlar */}
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: COLORS.bordo, marginBottom: 4 }}>NOT ORTALAMASI</div>
                <div style={{ fontSize: 11.5, color: COLORS.charcoal, opacity: 0.7, marginBottom: 10 }}>Vize %40, final %60 ağırlıkla hesaplanır.</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {COURSES.map((course) => {
                    const g = grades[course] || {};
                    const v = parseFloat(g.vize), f = parseFloat(g.final);
                    const hasBoth = !isNaN(v) && !isNaN(f);
                    const score = hasBoth ? Math.round(v * 0.4 + f * 0.6) : null;
                    return (
                      <div key={course} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: "11px 13px" }}>
                        <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.heading, marginBottom: 8 }}>{course}</div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <input type="number" min="0" max="100" placeholder="Vize" value={g.vize || ""} onChange={(e) => updateGrade(course, "vize", e.target.value)} style={{ flex: 1, minWidth: 0, padding: "8px 10px", borderRadius: 4, border: `1px solid ${COLORS.line}`, fontSize: 12.5, background: COLORS.parchment, color: COLORS.heading }} />
                          <input type="number" min="0" max="100" placeholder="Final" value={g.final || ""} onChange={(e) => updateGrade(course, "final", e.target.value)} style={{ flex: 1, minWidth: 0, padding: "8px 10px", borderRadius: 4, border: `1px solid ${COLORS.line}`, fontSize: 12.5, background: COLORS.parchment, color: COLORS.heading }} />
                          <div style={{ width: 62, textAlign: "center", flexShrink: 0 }}>
                            {score !== null ? (
                              <>
                                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 700, color: score >= 60 ? COLORS.green : COLORS.rust, lineHeight: 1 }}>{getLetterGrade(score)}</div>
                                <div style={{ fontSize: 9.5, color: COLORS.charcoal, opacity: 0.6 }}>{score} puan</div>
                              </>
                            ) : <div style={{ fontSize: 10.5, color: COLORS.charcoal, opacity: 0.4 }}>—</div>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {tab === "pomodoro" && (
                <div style={{ padding: "18px 20px" }}>
                  <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: COLORS.heading, marginBottom: 6 }}>Odak Modu</div>
                  <div style={{ fontSize: 12, color: COLORS.bordo, opacity: 0.8, marginBottom: 18, lineHeight: 1.4 }}> Süreni belirle, bildirimleri aç ve dikkatini sadece derse ver. </div>
                  {/* Pomodoro içeriği aynı */}
                  <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "30px 20px", textAlign: "center", boxShadow: "0 4px 12px rgba(28,43,74,0.03)" }}>
                    <div style={{ display: "inline-flex", gap: 6, marginBottom: 24, background: COLORS.parchment, padding: 4, borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
                      <button onClick={() => resetPomodoro("work")} style={{ padding: "8px 16px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, border: "none", background: pomoMode === "work" ? COLORS.bordo : "transparent", color: pomoMode === "work" ? COLORS.onAccent : COLORS.charcoal }}>Çalışma</button>
                      <button onClick={() => resetPomodoro("break")} style={{ padding: "8px 16px", borderRadius: 6, fontSize: 12.5, fontWeight: 600, border: "none", background: pomoMode === "break" ? COLORS.bordo : "transparent", color: pomoMode === "break" ? COLORS.onAccent : COLORS.charcoal }}>Mola</button>
                    </div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 72, fontWeight: 700, color: COLORS.heading, margin: "0 0 24px", lineHeight: 1, letterSpacing: -1.5 }}> {formatPomoTime()} </div>
                    <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                      <button onClick={() => setPomoIsRunning(!pomoIsRunning)} style={{ width: 140, padding: "14px 0", borderRadius: 8, border: "none", background: pomoIsRunning ? COLORS.gold : COLORS.ink, color: pomoIsRunning ? COLORS.ink : "#fff", fontWeight: 700, fontSize: 15 }}> {pomoIsRunning ? "Duraklat" : "Başla"} </button>
                      <button onClick={() => resetPomodoro(pomoMode)} style={{ width: 90, padding: "14px 0", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: COLORS.parchment, color: COLORS.charcoal, fontWeight: 600, fontSize: 14 }}> Sıfırla </button>
                    </div>
                  </div>
                </div>
            )}

            {/* Bottom Navigation */}
            <div id="bottom-nav" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: COLORS.surface, borderTop: `1px solid ${COLORS.line}`, display: "flex", padding: "10px 0 calc(10px + env(safe-area-inset-bottom))", zIndex: 100, overflowX: "auto", whiteSpace: "nowrap" }}>
              {[
                ["dersler", "Dersler"], ["kanunlar", "Kanunlar"], ["cards", "Kartlar"], ["pratik", "Pratik"], ["sozluk", "Sözlük"], ["pomodoro", "Odak"], ["topics", "Program"],
              ].map(([key, label]) => (
                <button key={key} onClick={() => { setTab(key); if (key !== "dersler") setSelectedCourse(null); if (key !== "cards") { setQuizMode(false); setQuiz(null); } }} style={{ flexShrink: 0, minWidth: "14%", flex: 1, background: "none", border: "none", fontSize: 10.5, fontWeight: 600, color: tab === key ? COLORS.bordo : "#9A9382", padding: "4px 2px" }}>
                  {label}
                </button>
              ))}
            </div>

          </div>

          {/* ---- YAZDIRMA SAYFASI ---- */}
          <div id="print-sheet" style={{ padding: 24, fontFamily: "'IBM Plex Sans', sans-serif", color: "#111" }}>
            {printCourse && (
              <>
                <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 22, margin: "0 0 4px" }}>{printCourse}</h1>
                <div style={{ fontSize: 12, color: "#555", marginBottom: 20, borderBottom: "1px solid #ccc", paddingBottom: 10 }}>
                  Muzo Hukuk — {cards.filter((c) => c.topic === printCourse).length} fiş · {new Date().toLocaleDateString("tr-TR")}
                </div>
                {cards.filter((c) => c.topic === printCourse).map((c, i) => (
                  <div key={c.id} style={{ marginBottom: 18, pageBreakInside: "avoid" }}>
                    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 5 }}>{i + 1}. {c.front}</div>
                    <div style={{ fontSize: 12.5, lineHeight: 1.5, paddingLeft: 14, borderLeft: "3px solid #ccc" }}>{c.back}</div>
                    {c.statute && <div style={{ fontSize: 11, color: "#666", marginTop: 4, paddingLeft: 14 }}>{c.statute}</div>}
                  </div>
                ))}
              </>
            )}
          </div>
        </>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HukukFisleri />);
  </script>
</body>
</html>
